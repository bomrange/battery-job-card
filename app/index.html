function resizeImage(file, max = 360, q = 0.82) {
  return new Promise((res, rej) => {
    if (!file.type.startsWith('image/')) return rej(new Error('Choose a photo file'));
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error('Could not read photo')), 'image/jpeg', q);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Could not read photo')); };
    img.src = url;
  });
}
const blobToDataUrl = b => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); });
async function uploadMyPhoto(file) {
  try {
    const blob = await resizeImage(file);
    const path = `${S.me.id}/avatar.jpg`;
    const { error } = await S.sb.storage.from('avatars').upload(path, blob, { upsert: true, contentType: 'image/jpeg' });
    if (error) throw error;
    const url = S.sb.storage.from('avatars').getPublicUrl(path).data.publicUrl + '?v=' + Date.now();
    const { error: e2 } = await S.sb.rpc('set_my_photo', { p_url: url });
    if (e2) throw e2;
    S.me.photo_url = url; if (S.people[S.me.id]) S.people[S.me.id].photo_url = url;
    return url;
  } catch (e) { console.warn(e); return null; }
}

    closeModal(); toast(j ? `${saved.jc_no} saved` : `${saved.jc_no} created${saved.tech_id ? ' for ' + firstName(personName(saved.tech_id)) : ''}`);
    S.day = ymd(new Date(saved.start_at)); if (S.view === 'dispatch') renderDispatch();
    if (j) openJob(saved.id, true);
  };
}

/* today's numbers for the people in view */
function teamTodayStrip(techs) {
  const t = todayStr(), ids = new Set(techs.map(p => p.id)), wh = techs.some(p => kindOf(p) === 'wh'), fd = techs.some(p => kindOf(p) === 'field');
  const g = whNumbers(t, t).p, fl = logsOf('field', t, t).filter(l => ids.has(l.user_id));
  const items = [];
  if (wh) items.push(['Received', g.received, 'fa-inbox'], ['Diagnosed', g.diagnosed, 'fa-stethoscope'], ['Repaired', g.repaired, 'fa-screwdriver-wrench'], ['Dispatched', g.sent, 'fa-truck-fast']);
  if (fd) items.push(['Repaired at stations', fl.reduce((a, l) => a + (l.data.repaired || 0), 0), 'fa-charging-station'], ['Failed, back to warehouse', fl.reduce((a, l) => a + (l.data.failed_back || 0), 0), 'fa-rotate-left']);
  return `<div class="grid grid-cols-2 md:grid-cols-${Math.min(6, items.length)} gap-3">${items.map(([l, v, i]) => `<div class="bg-surface rounded-2xl border border-cream-200 p-3"><div class="text-xs text-espresso-500 flex items-center gap-1.5"><i class="fa-solid ${i} text-caramel-700"></i>${l} today</div><div class="mt-1 font-display text-2xl font-semibold tnum">${v}</div></div>`).join('')}</div>`;
}

  if (r.some(x => ['repair_tech', 'wh_tech', 'qc', 'fabrication', 'spoc'].includes(x))) ['repaired', 'scrapped', 'warranty', 'spares'].forEach(k => keys.add(k));
  if (r.includes('field_tech')) ['received', 'repaired'].forEach(k => keys.add(k));
  if (!keys.size) LOG_FIELDS.forEach(f => keys.add(f.key));

}

async function fetchAll(build) {

    if (error) throw error;
    out.push(...(data || [])); if (!data || data.length < size) break;
  }
  return out;
}

/* sanity checks so the numbers add up */
function stageCheck(k, d) {

    const x = t[b] || {};

    if (k === 'air_leak' && (x.passed || 0) + (x.failed || 0) > (x.tested || 0)) return `${b}: passed + failed can't be more than tested.`;
    if (k === 'air_leak' && (x.refixed || 0) > (x.failed || 0)) return `${b}: retest passes can't be more than failures.`;
    if (k === 'iot' && (x.online || 0) + (x.offline || 0) > (x.checked || 0)) return `${b}: online + offline can't be more than checked.`;
    if (k === 'qc' && (x.passed || 0) + (x.failed || 0) > (x.checked || 0)) return `${b}: passed + failed can't be more than checked.`;
  }
  if (k === 'iot') { const e = iotRecoverCheck(d) || iotToAirCheck(d); if (e) return e; }
  if (k === 'spares') {
    const keep = S.stage; S.stage = S.stage.filter(l => !(l.stage === 'spares' && l.user_id === S.me.id && l.day === logDay())); 
    try { for (const b of TEAMS) { const arr = (((d.arrived || {})[b] || {}).n || 0), have = sparesNow([b]) + (((d.add || {})[b] || {}).n || 0); if (arr > have) return `${b}: only ${have} batteries are waiting for spares, so ${arr} can't have arrived.`; } }
    finally { S.stage = keep; }
  }
  if (k === 'repair' && !d.brand) return 'Choose the brand.';
  if (k === 'repair' && d.warranty) {
    const wr = Object.values(d.wr || {}).reduce((a, n) => a + (n || 0), 0);
    if (issuesOf('warranty').length && wr !== d.warranty) return `You sent ${d.warranty} for warranty but gave reasons for ${wr}. Give a reason for each battery moved to QC.`;
    if (!issuesOf('warranty').length && !String(d.warranty_reason || '').trim()) return 'Say why the batteries were moved to QC (warranty).';
  }
  if (k === 'repair' && d.repaired && issuesOf('sop').length) { const miss = issuesOf('sop').filter(s => !(d.sop || []).includes(s)); if (miss.length) return `Tick the checklist before counting batteries as repaired. Missing: ${miss.join(', ')}.`; }
  if (TEAM_STAGES[k]) { const e = teamCheck(k, d); if (e) return e; }
  if (STAGE_COUNT[k]) for (const b of TEAMS) {
    const n = STAGE_COUNT[k](d, b); if (!n) continue;
    const r = stageRoom(k, b), myOp = TEAM_STAGES[k] ? (((d.opening || {})[b] || {}).n || 0) : 0; r.room += myOp; r.received += myOp;
    if (n > r.room) return `${b}: only ${r.received} received so far and ${r.prior} already ${STAGE_NOUN[k]}. You can enter at most ${r.room}.`;
  }
  if (k === 'repair') {
    const st = techDocket(S.me.id, true), out = ['repaired', 'scrapped', 'warranty', 'handed_fab', 'handed_iot'].reduce((a, f) => a + (d[f] || 0), 0);
    if (out > st.given - st.done) return `You were given ${st.given} and already finished or handed over ${st.done}. Today you can enter at most ${Math.max(0, st.given - st.done)}. Ask your SPOC to give you more.`;
  }
  if (k === 'fabrication') for (const b of TEAMS) {
    const x = t[b] || {}, n = (x.fixed || 0) + (x.scrapped || 0); if (!n) continue;
    const P = brandPool(b), op = openingOf('fabrication', b) + (((d.opening || {})[b] || {}).n || 0), room = Math.max(0, P.handedFab + op - P.fabFixed - P.fabScrapped);
    if (n > room) return `${b}: ${P.handedFab + op} came to fabrication and ${P.fabFixed + P.fabScrapped} are already done. You can enter at most ${room}.`;
  }
  return '';
}

  if (/^c:/.test(WH.period || '')) out.push([WH.period, periodRange(WH.period)[2]]);

function periodRange(p) {

  if (/^c:\d{4}-\d{2}-\d{2}:\d{4}-\d{2}-\d{2}$/.test(p || '')) { const [f, e] = p.slice(2).split(':'); return [f, e, f === e ? fmtDay(f) : `${fmtDay(f)} – ${fmtDay(e)}`]; }
  if (p === 'week') { const d = new Date(t); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return [ymd(d), to, 'This week']; }

}

const rSum = (logs, f) => logs.reduce((a, l) => a + ((l.data || {})[f] || 0), 0);
function latestPerUser(logs) { const m = {}; logs.forEach(l => { if (!m[l.user_id] || l.day > m[l.user_id].day) m[l.user_id] = l; }); return Object.values(m); }
function countMap(logs, path, brands) {   // {name: n} summed, optionally per-brand nested
  const out = {};
  logs.forEach(l => { const o = getp(l.data || {}, path) || {};
    if (brands) brands.forEach(b => Object.entries(o[b] || {}).forEach(([k, v]) => out[k] = (out[k] || 0) + (+v || 0)));
    else Object.entries(o).forEach(([k, v]) => out[k] = (out[k] || 0) + (+v || 0)); });
  return out;
}
const sortedCounts = m => Object.entries(m).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);

/* flows for a period, plus stock worked out from everything ever logged */
function whNumbers(from, to, brands = TEAMS) {
  const flow = (f, t2) => {
    const rec = logsOf('receiving', f, t2), ins = logsOf('insulation', f, t2), iot = logsOf('iot', f, t2), air = logsOf('air_leak', f, t2), dis = logsOf('dispatch', f, t2), qc = logsOf('qc', f, t2), rep = repLogs(brands, f, t2), fab = logsOf('fabrication', f, t2);
    const diag = countMap(logsOf('diagnosis', f, t2), 'issues', brands);
    return {
      received: tSum(rec, 'recv', brands), diagnosed: Object.values(diag).reduce((a, b) => a + b, 0),
      repaired: rSum(rep, 'repaired'), scrapped: rSum(rep, 'scrapped'), warranty: rSum(rep, 'warranty'),
      handedFab: rSum(rep, 'handed_fab'), handedIot: rSum(rep, 'handed_iot'), iotFab: tSum(iot, 'to_fab', brands), airFab: tSum(air, 'to_fab', brands), fabFixed: tSum(fab, 'fixed', brands), fabScrapped: tSum(fab, 'scrapped', brands),
      insTested: tSum(ins, 'tested', brands), insPassed: tSum(ins, 'passed', brands), insFailed: tSum(ins, 'failed', brands),
      iotChecked: tSum(iot, 'checked', brands), online: tSum(iot, 'online', brands), offline: tSum(iot, 'offline', brands), recovered: tSum(iot, 'recovered', brands),
      airTested: tSum(air, 'tested', brands), airPassed: tSum(air, 'passed', brands), airFailed: tSum(air, 'failed', brands), refixed: tSum(air, 'refixed', brands),
      sent: tSum(dis, 'sent', brands), out: tSum(dis, 'out', brands), back: tSum(dis, 'back', brands),
      addScrapped: sSum(dis, 'scrapped', brands), addWarranty: sSum(dis, 'warranty', brands), toQc: sSum(dis, 'to_qc', brands),
      qcChecked: tSum(qc, 'checked', brands), qcPassed: tSum(qc, 'passed', brands), qcFailed: tSum(qc, 'failed', brands)
    };
  };
  const p = flow(from, to), A = from || to ? flow(null, null) : p;
  const hold = latestPerUser(repLogs(brands)), spL = latestSpares();
  const spares = spL ? sparesNow(brands) : 0, underTest = rSum(hold, 'under_test');
  const opening = k => brands.reduce((a, b) => a + openingOf(k, b, false), 0);
  const allocated = repAlloc().filter(a => brands.includes(a.brand)).reduce((a, x) => a + x.qty, 0);
  const incoming = tSum(logsOf('receiving', todayStr(), todayStr()), 'incoming', brands);
  return {
    p, A, spares, underTest, allocated, incoming,
    onHand: Math.max(0, A.received + A.back - A.sent - A.out),
    awaitingDiag: Math.max(0, A.received - A.diagnosed),
    underRepair: Math.max(0, allocated - A.repaired - A.scrapped - A.warranty - A.handedFab - A.handedIot - spares - underTest),
    atFab: Math.max(0, A.handedFab + A.iotFab + A.airFab + opening('fabrication') - A.fabFixed - A.fabScrapped),
    airWaiting: brands.reduce((a, b) => a + airWaitingOf(b), 0),
    toGive: Math.max(0, A.received + A.fabFixed - allocated),
    iotOffline: Math.max(0, A.offline + opening('iot') - A.recovered - A.iotFab),
    airFail: Math.max(0, A.airFailed - A.refixed - A.airFab),
    ready: Math.max(0, A.airPassed + A.refixed - A.sent),
    withPartner: Math.max(0, A.out - A.back),
    scrapped: A.scrapped + A.addScrapped + A.fabScrapped, warranty: A.warranty + A.addWarranty + A.toQc, toQc: A.toQc, dispatched: A.sent
  };
}
/* one technician: given by SPOC vs finished vs still holding */
function techDocket(uid, skipToday) {
  const al = repAlloc().filter(a => a.tech_id === uid);
  const given = al.reduce((a, x) => a + x.qty, 0);
  const mine = logsOf('repair').filter(l => l.user_id === uid && !(skipToday && l.day === todayStr()));
  const handed = rSum(mine, 'handed_fab') + rSum(mine, 'handed_iot');
  const done = rSum(mine, 'repaired') + rSum(mine, 'scrapped') + rSum(mine, 'warranty') + handed;
  const last = latestPerUser(mine)[0], holding = last ? ((last.data.spares || 0) + (last.data.under_test || 0)) : 0;
  const by = {}; al.forEach(a => by[a.issue] = (by[a.issue] || 0) + a.qty);
  return { given, done, holding, left: Math.max(0, given - done - holding), handed, byIssue: sortedCounts(by), repaired: rSum(mine, 'repaired'), spares: last ? last.data.spares || 0 : 0, test: last ? last.data.under_test || 0 : 0 };
}

/* everything logged in the period as a spreadsheet: one row per entry and number */
function downloadCsv(from, to, plabel) {
  const rows = [['Day', 'Staff ID', 'Name', 'Stage', 'Brand', 'Item', 'Number', 'Notes']];
  const flat = (o, pre = []) => Object.entries(o || {}).flatMap(([k, v]) => v && typeof v === 'object' && !Array.isArray(v) ? flat(v, pre.concat(k)) : [[pre.concat(k), v]]);
  S.stage.filter(l => l.stage !== 'field' || S.role === 'admin').filter(l => (!from || l.day >= from) && (!to || l.day <= to)).forEach(l => {
    const p = person(l.user_id) || {}, base = [l.day, p.staff_id || '', p.full_name || '', l.stage === 'field' ? 'Field' : STAGES[l.stage].label];
    const d = { ...l.data }; const mistakes = d.mistakes || []; delete d.mistakes; const st = d.stations || []; delete d.stations;
    flat(d).forEach(([path, v]) => {
      let brand = l.stage === 'repair' ? d.brand || '' : ''; let item = path.filter(x => x !== 't');
      if (TEAMS.includes(item[0])) { brand = item[0]; item = item.slice(1); } else if (TEAMS.includes(item[1])) { brand = item[1]; item = [item[0], ...item.slice(2)]; }
      if (path[0] === 'brand') return;
      rows.push([...base, brand, item.join(' / '), typeof v === 'number' ? v : '', typeof v === 'number' ? '' : v]);
    });
    mistakes.forEach(m => rows.push([...base, m.brand, 'Mistake by ' + personName(m.tech), m.n, m.reason || '']));
    if (st.length) rows.push([...base, '', 'Stations visited', st.length, st.map(id => (S.stations.find(s => s.id === id) || {}).name).filter(Boolean).join('; ')]);
    if (l.note) rows.push([...base, '', 'Note', '', l.note]);
  });
  const csv = rows.map(r => r.map(c => { c = String(c ?? ''); return /[",\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(',')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv' }));
  a.download = `battery-ops-${plabel.toLowerCase().replace(/\s+/g, '-')}.csv`; document.body.appendChild(a); a.click(); a.remove();
  toast(`${rows.length - 1} rows downloaded`);
}

/* ================= TEAM LEADS: IoT, air leak and fabrication leads give work to their team (themselves too) ================= */
const tget = (d, b, f) => ((((d || {}).t || {})[b] || {})[f] || 0);
const TEAM_STAGES = {
  iot:         { done: (d, b) => tget(d, b, 'checked'), doneLabel: 'checked', openLabel: 'Already offline at IoT' },
  air_leak:    { done: (d, b) => tget(d, b, 'tested'), doneLabel: 'tested', openLabel: 'Already waiting for air leak test' },
  fabrication: { done: (d, b) => tget(d, b, 'fixed') + tget(d, b, 'scrapped'), doneLabel: 'done', openLabel: 'Already at fabrication' }
};
const isLead = (p = S.me) => ((p && p.roles) || []).includes('team_lead');
const leadStages = (p = S.me) => appRoleOf(p) === 'admin' ? Object.keys(TEAM_STAGES) : (isLead(p) ? Object.keys(TEAM_STAGES).filter(k => STAGES[k].roles.some(r => (p.roles || []).includes(r))) : []);
const teamMembers = k => S.peopleList.filter(p => p.active !== false && STAGES[k].roles.some(r => (p.roles || []).includes(r))).sort((a, b) => a.full_name.localeCompare(b.full_name));
const stageAlloc = k => S.alloc.filter(a => a.stage === k);
/* batteries that reached this stage so far, per brand */
function stageInflow(k, b) {
  const op = openingOf(k, b, false), rep = logsOf('repair').filter(l => (l.data || {}).brand === b);
  if (k === 'iot') return op + rSum(rep, 'handed_iot') + tSum(logsOf('insulation'), 'passed', [b]);
  if (k === 'air_leak') return op + iotToAir(b);
  return op + rSum(rep, 'handed_fab');
}
const memberGiven = (k, uid, b) => stageAlloc(k).filter(a => a.tech_id === uid && (!b || a.brand === b)).reduce((a, x) => a + x.qty, 0);
const memberDone = (k, uid, b, skipToday) => logsOf(k).filter(l => l.user_id === uid && !(skipToday && l.day === todayStr())).reduce((a, l) => a + (b ? TEAM_STAGES[k].done(l.data, b) : TEAMS.reduce((s, x) => s + TEAM_STAGES[k].done(l.data, x), 0)), 0);
const stageLeft = (k, b) => Math.max(0, stageInflow(k, b) - stageAlloc(k).filter(a => a.brand === b).reduce((a, x) => a + x.qty, 0));
/* once a lead starts giving out work, each person can only count what they were given */
function teamCheck(k, d) {
  if (!stageAlloc(k).length) return '';
  for (const b of TEAMS) {
    const n = TEAM_STAGES[k].done(d, b); if (!n) continue;
    const g = memberGiven(k, S.me.id, b), dn = memberDone(k, S.me.id, b, true);
    if (n > g - dn) return `${b}: your team lead gave you ${g} and you already ${TEAM_STAGES[k].doneLabel} ${dn}. You can enter at most ${Math.max(0, g - dn)}. Ask your lead to give you more.`;
  }
  return '';
}
function teamLine(k) {
  if (!TEAM_STAGES[k] || !stageAlloc(k).length) return '';
  const parts = TEAMS.map(b => { const g = memberGiven(k, S.me.id, b); if (!g) return ''; const dn = memberDone(k, S.me.id, b); return `${b}: <b class="tnum">${g}</b> given · ${dn} ${TEAM_STAGES[k].doneLabel} · <b class="tnum">${Math.max(0, g - dn)}</b> left`; }).filter(Boolean);
  return `<div class="rounded-xl bg-caramel-100/60 p-3 text-sm"><b>Given to you by your team lead:</b> ${parts.length ? parts.join(' · ') : 'nothing yet'}</div>`;
}
const openingSection = (k, d) => STOCK_FIX[k] && S.adjOk ? (canAdjust(k) ? `<div class="rounded-xl border border-caramel-200 bg-caramel-100/50 p-3 text-sm flex flex-wrap items-center gap-2"><span class="flex-1"><b>${STOCK_FIX[k].title}:</b> ${TEAMS.map(b => `${b} <b class="tnum">${STOCK_FIX[k].of(b)}</b>`).join(' · ')}<span class="block text-xs text-espresso-500">Team lead only. Correct it if it doesn't match what is really there.</span></span>${stockFixBtn(k)}</div>` : '') : (TEAM_STAGES[k] && (isLead() || S.role === 'admin')) ? section(TEAM_STAGES[k].openLabel + ' (opening stock)', brandGrid('opening', [['n', 'Batteries']], d), 'Only for batteries that were already here before we started logging. Team lead only.') : '';

S.teamTab = null;

/* ================= SPARES: one person keeps the "waiting for spares" stock up to date ================= */
function sparesForm(d) {
  return `<div class="rounded-xl bg-cream-100 p-3 text-sm"><b>Waiting for spares now:</b> ${TEAMS.map(b => `${b} <b class="tnum">${sparesNow([b])}</b>`).join(' · ')}</div>`
    + section('New batteries waiting for spares', brandGrid('add', [['n', 'Add today']], d), 'Only the new ones since your last entry. They are added to the number above.')
    + section('Spares arrived today', brandGrid('arrived', [['n', 'Batteries sent back to repair']], d), 'They are taken off the number above.')
    + txtIn('missing', d.missing, 'Which spares are we waiting for?', 'e.g. 6 BMS boards for CBAK');
}
const sparesSorted = () => [...logsOf('spares')].sort((a, b) => (a.day + (a.updated_at || '')).localeCompare(b.day + (b.updated_at || '')));
const latestSpares = () => sparesSorted().pop();
/* waiting for spares: the last whole number entered the old way, then every "add" minus every "arrived" after it */
function sparesNow(brands = TEAMS) {
  const L = sparesSorted(), bi = L.map(l => !!(l.data || {}).waiting).lastIndexOf(true);
  const n = (l, key, b) => ((((l.data || {})[key] || {})[b] || {}).n || 0);
  return brands.reduce((s, b) => s + Math.max(0, L.reduce((a, l, i) => i < bi ? a : i === bi ? n(l, 'waiting', b) + n(l, 'add', b) : a + n(l, 'add', b) - n(l, 'arrived', b), 0)), 0);
}

/* ================= ADD-ONLY: after the first save, people add to today's numbers instead of editing them ================= */
const SNAP_KEYS = { repair: ['spares', 'under_test'], spares: ['waiting'] };
const REPLACE_TXT = ['brand', 'top_issue'];
function mergeAdd(old, add, k) {
  const snap = SNAP_KEYS[k] || [];
  const walk = (o, a, top) => {
    Object.entries(a).forEach(([key, v]) => {
      if (top && snap.includes(key)) o[key] = v;
      else if (typeof v === 'number') o[key] = (typeof o[key] === 'number' ? o[key] : 0) + v;
      else if (Array.isArray(v)) o[key] = (Array.isArray(o[key]) ? o[key] : []).concat(v);
      else if (v && typeof v === 'object') o[key] = walk(o[key] && typeof o[key] === 'object' ? o[key] : {}, v, false);
      else if (typeof v === 'string' && v) o[key] = REPLACE_TXT.includes(key) || !o[key] ? v : o[key] + ' · ' + v;
    });
    return o;
  };
  const out = walk(JSON.parse(JSON.stringify(old || {})), add, true);
  out._adds = (old && old._adds ? old._adds : [{ at: null }]).concat({ at: new Date().toISOString() });
  return out;
}
const NUM_LABEL = { recv: 'received', incoming: 'still incoming', tested: 'tested', passed: 'passed', failed: 'failed', refixed: 'fixed on retest', checked: 'checked', online: 'online', offline: 'offline', recovered: 'brought back', sent: 'dispatched', out: 'handed over', back: 'returned', fixed: 'fixed', scrapped: 'scrapped', warranty: 'warranty', to_qc: 'moved to QC', repaired: 'repaired', handed_fab: 'to fabrication', handed_iot: 'to IoT', to_air: 'to air leak', to_fab: 'to fabrication', spares: 'waiting for spares', under_test: 'under test' };
function savedSummary(d) {
  const out = [];
  const walk = (o, path) => Object.entries(o || {}).forEach(([k, v]) => {
    if (k === '_adds') return;
    if (typeof v === 'number') { const last = path.concat(k); const name = k === 'n' ? path[0] === 'opening' ? 'opening stock' : path[0] === 'waiting' ? 'waiting for spares' : path[0] === 'add' ? 'added to waiting for spares' : path[0] === 'arrived' ? 'spares arrived' : '' : (NUM_LABEL[k] || k); const brand = last.find(x => TEAMS.includes(x)); out.push(`${brand ? brand + ' ' : ''}${name}${path[0] === 'issues' || path[0] === 'reasons' || path[0] === 'damage' || path[0] === 'out_reasons' ? ` (${k})` : ''}: <b class="tnum">${v}</b>`.replace(` ${k} (${k})`, ` ${k}`)); }
    else if (v && typeof v === 'object' && !Array.isArray(v)) walk(v, path.concat(k));
  });
  walk(d, []);
  return out.length ? out.join(' · ') : 'No numbers yet.';
}

async function loadStore() {

    const [it, mv] = await Promise.all([
      S.sb.from('store_items').select('*').order('name'),
      fetchAll(() => S.sb.from('store_moves').select('*').order('created_at'))

    if (it.error) throw it.error;
    S.storeItems = it.data || []; S.storeMoves = mv;
  } catch (e) { S.storeItems = S.storeItems || []; S.storeMoves = S.storeMoves || []; }
}
const STORE_SIGN = { restock: 1, return: 1, out: -1, issue: -1, lost: 0, count_add: 1, count_less: -1 };
const MOVE_LABEL = { restock: 'Added to store', out: 'Taken', return: 'Returned', issue: 'Used up (issued)', lost: 'Lost or broken', count_add: 'Stock count: more than expected', count_less: 'Stock count: fewer than expected' };
/* in store = added + returned − taken − issued; a lost tool was already taken out, so it just stops being "out" */
function itemStock(id) {
  const mv = S.storeMoves.filter(m => m.item_id === id);
  const inStore = mv.reduce((a, m) => a + (STORE_SIGN[m.kind] || 0) * m.qty, 0);
  const out = mv.reduce((a, m) => a + (m.kind === 'out' ? m.qty : m.kind === 'return' || m.kind === 'lost' ? -m.qty : 0), 0);
  return { inStore: Math.max(0, inStore), out: Math.max(0, out) };
}
/* tools each person still holds: [{tech, item, qty, since}] */
function toolsOut(techId) {
  const m = {};
  S.storeMoves.filter(x => ['out', 'return', 'lost'].includes(x.kind) && x.tech_id && (!techId || x.tech_id === techId)).forEach(x => {
    const k = x.tech_id + '|' + x.item_id, o = m[k] = m[k] || { tech: x.tech_id, item: x.item_id, qty: 0, since: null };
    if (x.kind === 'out') { o.qty += x.qty; if (!o.since || o.qty === x.qty) o.since = x.created_at; } else o.qty -= x.qty;
  });
  return Object.values(m).filter(o => o.qty > 0).sort((a, b) => (a.since || '').localeCompare(b.since || ''));
}

  whRepaired: 'Repaired by the warehouse repair lines.',
  fieldRepaired: 'Repaired by field technicians at swap stations.'
};
/* a stat card that opens its details when tapped */
const statBtn = (key, label, val, icon, tone, sub) => `<button type="button" data-detail="${key}" class="text-left rounded-2xl h-full hover:ring-2 hover:ring-caramel-400/50 focus:outline-none focus:ring-2 focus:ring-caramel-500 transition">${statCard(label, val, icon, tone, sub || GLOSSARY[key] || '').replace('class="bg-surface', 'class="h-full bg-surface')}</button>`;

/* ---- warehouse repairs vs swap-station repairs, per day ---- */
function graphDays(period) {
  const t = todayStr(), back = n => { const d = new Date(t + 'T12:00:00'); d.setDate(d.getDate() - n); return d.toISOString().slice(0, 10); };
  let from = period === 'week' ? back(6) : period === 'month' ? monthStart() : period === 'all' ? (S.stage.length ? S.stage.reduce((a, l) => l.day < a ? l.day : a, t) : back(13)) : back(13);
  if (from > back(6) && period !== 'week' && !/^m:/.test(period || '')) from = back(13);
  let end = t; if (/^m:/.test(period || '')) { [from, end] = periodRange(period); }
  if (/^c:/.test(period || '')) { [from, end] = periodRange(period); if (from > back(6) || from === end) { const d = new Date(end + 'T12:00:00'); d.setDate(d.getDate() - 6); if (ymd(d) < from) from = ymd(d); } }
  const days = []; for (let d = new Date(from + 'T12:00:00'); d.toISOString().slice(0, 10) <= end; d.setDate(d.getDate() + 1)) days.push(d.toISOString().slice(0, 10));
  return days;
}
function repairSeries(period, brands = TEAMS, fieldIds = null) {
  const days = graphDays(period), from = days[0], to = days[days.length - 1];
  const wh = {}, fd = {};
  repLogs(brands, from, to).forEach(l => { wh[l.day] = (wh[l.day] || 0) + (l.data.repaired || 0); });
  logsOf('field', from, to).filter(l => !fieldIds || fieldIds.has(l.user_id)).forEach(l => { fd[l.day] = (fd[l.day] || 0) + (l.data.repaired || 0); });
  let pts = days.map(d => [d, wh[d] || 0, fd[d] || 0]);
  if (pts.length > 62) { const wk = []; for (let i = 0; i < pts.length; i += 7) { const s = pts.slice(i, i + 7); wk.push([s[0][0], s.reduce((a, x) => a + x[1], 0), s.reduce((a, x) => a + x[2], 0)]); } pts = wk; }
  return { pts, weekly: days.length > 62 };
}
function vsGraph(period, brands, fieldIds, plabel) {
  const { pts, weekly } = repairSeries(period, brands, fieldIds);
  const [from, to] = periodRange(period);
  const whT = repLogs(brands, from, to).reduce((a, l) => a + (l.data.repaired || 0), 0);
  const fdT = logsOf('field', from, to).filter(l => !fieldIds || fieldIds.has(l.user_id)).reduce((a, l) => a + (l.data.repaired || 0), 0);
  const W = 640, H = 170, P = 28, max = Math.max(4, ...pts.map(p => Math.max(p[1], p[2])));
  const x = i => P + (pts.length < 2 ? (W - 2 * P) / 2 : i * (W - 2 * P) / (pts.length - 1)), y = v => H - P - v * (H - 2 * P) / max;
  const line = (k, c) => `<polyline fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="${pts.map((p, i) => `${x(i).toFixed(1)},${y(p[k]).toFixed(1)}`).join(' ')}"/>${pts.map((p, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(p[k]).toFixed(1)}" r="3" fill="${c}"><title>${fmtDay(p[0])}: ${p[k]}</title></circle>`).join('')}`;
  const ticks = [0, Math.round(max / 2), max].map(v => `<line x1="${P}" x2="${W - P}" y1="${y(v)}" y2="${y(v)}" stroke="currentColor" stroke-opacity=".12"/><text x="${P - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="currentColor" fill-opacity=".55">${v}</text>`).join('');
  const lbl = [0, Math.floor((pts.length - 1) / 2), pts.length - 1].filter((v, i, a) => a.indexOf(v) === i).map(i => `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="10" fill="currentColor" fill-opacity=".55">${esc(fmtDay(pts[i][0]).replace(/^\w+ /, ''))}</text>`).join('');
  return panel('Warehouse vs swap station repairs', `<div class="grid grid-cols-3 gap-3 mb-3">
      <button type="button" data-detail="whRepaired" class="text-left rounded-xl bg-cream-100 p-3 hover:ring-2 hover:ring-caramel-400/50"><div class="text-xs text-espresso-500 flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-[#8B5A2B]"></span>Warehouse</div><div class="font-display text-2xl font-semibold tnum">${whT}</div></button>
      <button type="button" data-detail="fieldRepaired" class="text-left rounded-xl bg-cream-100 p-3 hover:ring-2 hover:ring-caramel-400/50"><div class="text-xs text-espresso-500 flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-[#6B8E4E]"></span>Swap stations</div><div class="font-display text-2xl font-semibold tnum">${fdT}</div></button>
      <div class="rounded-xl bg-espresso-900 text-cream-50 p-3"><div class="text-xs opacity-80">Total repaired</div><div class="font-display text-2xl font-semibold tnum">${whT + fdT}</div></div></div>
    <svg viewBox="0 0 ${W} ${H}" class="w-full h-auto text-espresso-900 dark:text-cream-50" role="img" aria-label="Line graph of batteries repaired per ${weekly ? 'week' : 'day'}, warehouse against swap stations">${ticks}${line(1, '#8B5A2B')}${line(2, '#6B8E4E')}${lbl}</svg>
    <p class="text-xs text-espresso-500 mt-1">Batteries repaired per ${weekly ? 'week' : 'day'}. Totals are for ${esc(plabel)}. Swap station numbers come from field technicians' daily logs.</p>`, '', plabel);
}

/* ---- tapping a card shows where the number comes from ---- */
function openDetail(key, from, to, brands, fieldIds) {
  const per = TEAMS.filter(b => brands.includes(b)).map(b => [b, whNumbers(from, to, [b])]);
  const pick = { onHand: g => g.onHand, underRepair: g => g.underRepair, spares: g => g.spares, underTest: g => g.underTest, atFab: g => g.atFab, iotOffline: g => g.iotOffline, airWaiting: g => g.airWaiting, airFail: g => g.airFail, ready: g => g.ready, awaitingDiag: g => g.awaitingDiag, scrapped: g => g.scrapped, warranty: g => g.warranty, withPartner: g => g.withPartner, incoming: g => g.incoming };
  const titles = { onHand: 'In the warehouse', underRepair: 'Under repair', spares: 'Waiting for spares', underTest: 'Under test', atFab: 'At fabrication', iotOffline: 'Offline at IoT', airWaiting: 'Waiting for air leak', airFail: 'Failed air leak', ready: 'Ready to dispatch', awaitingDiag: 'Waiting for diagnosis', scrapped: 'Scrapped', warranty: 'Warranty (moved to QC)', withPartner: 'With Quality / O&M', incoming: 'Incoming today', whRepaired: 'Warehouse repairs', fieldRepaired: 'Swap station repairs' };
  const goTo = { underRepair: 'docket', atFab: 'teamwork', iotOffline: 'teamwork', airFail: 'teamwork', fieldRepaired: 'region' };
  const row = (a, b, c = '') => `<li class="py-2 flex items-center gap-3 text-sm"><span class="flex-1 min-w-0">${a}</span>${c ? `<span class="text-xs text-espresso-500">${c}</span>` : ''}<b class="tnum">${b}</b></li>`;
  let body = '';
  if (pick[key]) body += `<h3 class="text-xs font-semibold text-espresso-500 mb-1">BY BRAND</h3><ul class="divide-y divide-cream-100 mb-4">${per.map(([b, g]) => row(b, pick[key](g))).join('')}</ul>`;
  const people = [];
  if (key === 'underRepair') S.peopleList.filter(p => TEAMS.includes(p.team) && brands.includes(p.team)).forEach(p => { const d = techDocket(p.id); if (d.left) people.push(row(esc(p.full_name), d.left, `${esc(p.team)} · given ${d.given}`)); });
  if (key === 'spares') { const l = latestSpares(); if (l) { people.push(row(`Updated by ${esc(personName(l.user_id))}`, '', fmtDay(l.day))); if (l.data.missing) people.push(`<li class="py-2 text-sm"><b>Waiting for:</b> ${esc(l.data.missing)}</li>`); } }
  const logList = (stage, f, label, filter = () => true) => logsOf(stage, from, to).filter(filter).map(l => [l, f(l)]).filter(x => x[1]).reverse().slice(0, 40).forEach(([l, n]) => people.push(row(`${esc(personName(l.user_id))}${label ? ' · ' + label(l) : ''}`, n, fmtDay(l.day))));
  if (key === 'scrapped') { logList('repair', l => brands.includes(l.data.brand) ? l.data.scrapped : 0, l => esc(l.data.brand) + ' line'); logList('fabrication', l => tSum([l], 'scrapped', brands), () => 'fabrication'); logList('dispatch', l => sSum([l], 'scrapped', brands), () => 'added to stock'); }
  if (key === 'warranty') { const why = {}; logsOf('repair', from, to).filter(l => brands.includes(l.data.brand)).forEach(l => Object.entries(l.data.wr || {}).forEach(([r, n]) => { why[r] = (why[r] || 0) + (n || 0); }));
    const wl = Object.entries(why).filter(x => x[1]).sort((a, b) => b[1] - a[1]); if (wl.length) body += `<h3 class="text-xs font-semibold text-espresso-500 mb-1">WHY THEY WERE MOVED TO QC</h3><ul class="divide-y divide-cream-100 mb-4">${wl.map(([r, n]) => row(esc(r), n)).join('')}</ul>`;
    logList('repair', l => brands.includes(l.data.brand) ? l.data.warranty : 0, l => esc(l.data.brand) + ' line' + (l.data.warranty_reason ? ' · ' + esc(l.data.warranty_reason) : '')); logList('dispatch', l => sSum([l], 'warranty', brands) + sSum([l], 'to_qc', brands), () => 'added to stock'); }
  if (key === 'whRepaired') logList('repair', l => brands.includes(l.data.brand) ? l.data.repaired : 0, l => esc(l.data.brand));

/* ================= TURNAROUND (TAT) & SLA: how fast batteries given to a person get finished ================= */
S.settings = { tat_days: 1 };
async function loadSettings() {
  try { const { data, error } = await S.sb.from('app_settings').select('*'); if (error) throw error; (data || []).forEach(r => { S.settings[r.key] = r.value; }); } catch (e) {}
}
const tatTarget = () => Math.max(1, parseInt(S.settings.tat_days, 10) || 1);
const dayDiff = (a, b) => Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 864e5);
/* oldest batteries are finished first; returns per-battery turnaround in days */
function tatFrom(given, done, target = tatTarget()) {
  const q = given.map(g => ({ day: g.day, left: g.qty })).sort((a, b) => a.day.localeCompare(b.day));
  const fin = [];
  done.sort((a, b) => a.day.localeCompare(b.day)).forEach(d => {
    let n = d.n;
    while (n > 0 && q.length) { const h = q[0], take = Math.min(n, h.left); for (let i = 0; i < take; i++) fin.push({ given: h.day, done: d.day, days: Math.max(0, dayDiff(h.day, d.day)) }); h.left -= take; n -= take; if (!h.left) q.shift(); }
  });
  const t = todayStr(), open = q.reduce((a, h) => a + h.left, 0), overdue = q.reduce((a, h) => a + (dayDiff(h.day, t) > target ? h.left : 0), 0);
  const oldest = q.length ? dayDiff(q[0].day, t) : 0;
  return { fin, open, overdue, oldest };
}
const doneOfRepair = l => ['repaired', 'scrapped', 'warranty', 'handed_fab', 'handed_iot'].reduce((a, f) => a + ((l.data || {})[f] || 0), 0);
function personTat(uid, stage = 'repair') {
  if (stage === 'repair') return tatFrom(repAlloc().filter(a => a.tech_id === uid).map(a => ({ day: a.day, qty: a.qty })), logsOf('repair').filter(l => l.user_id === uid).map(l => ({ day: l.day, n: doneOfRepair(l) })));
  return tatFrom(stageAlloc(stage).filter(a => a.tech_id === uid).map(a => ({ day: a.day, qty: a.qty })), logsOf(stage).filter(l => l.user_id === uid).map(l => ({ day: l.day, n: TEAMS.reduce((s, b) => s + TEAM_STAGES[stage].done(l.data, b), 0) })));
}
/* summary of finishes inside a period */
function tatSummary(T, from, to, target = tatTarget()) {
  const f = T.fin.filter(x => (!from || x.done >= from) && (!to || x.done <= to));
  if (!f.length) return { n: 0, avg: null, onTime: null, overdue: T.overdue, open: T.open, oldest: T.oldest };
  const on = f.filter(x => x.days <= target).length;
  return { n: f.length, avg: f.reduce((a, x) => a + x.days, 0) / f.length, onTime: Math.round(on / f.length * 100), overdue: T.overdue, open: T.open, oldest: T.oldest };
}
const fmtTat = s => s.avg == null ? 'no finishes yet' : `${s.onTime}% on time · avg ${s.avg < 1 ? 'same day' : s.avg.toFixed(1) + ' days'}`;
const tatTone = s => s.onTime == null ? 'text-espresso-500' : s.onTime >= 80 ? 'text-olive-700' : s.onTime >= 50 ? 'text-warn-800' : 'text-terra-700';
/* everyone holding batteries past the target right now */
function overdueNow() {
  const rows = [];
  const ids = new Set(repAlloc().map(a => a.tech_id));
  ids.forEach(uid => { const T = personTat(uid); if (T.overdue) rows.push({ uid, stage: 'repair', n: T.overdue, oldest: T.oldest }); });
  Object.keys(TEAM_STAGES).forEach(k => new Set(stageAlloc(k).map(a => a.tech_id)).forEach(uid => { const T = personTat(uid, k); if (T.overdue) rows.push({ uid, stage: k, n: T.overdue, oldest: T.oldest }); }));
  return rows.filter(r => S.role === 'admin' || S.role === 'viewer' || inScopeId(r.uid) || r.uid === S.me.id).sort((a, b) => b.oldest - a.oldest);
}

/* ================= OFFLINE: save daily counts on the phone when there is no internet, send them when it's back ================= */
const QKEY = () => 'bo_queue_' + (S.me ? S.me.id : '');
const readQ = () => { try { return JSON.parse(store.get(QKEY()) || '[]'); } catch (e) { return []; } };
const writeQ = q => store.set(QKEY(), JSON.stringify(q));
const isNetErr = e => !navigator.onLine || /fetch|network|load failed|timeout|offline/i.test((e && (e.message || e.details || String(e))) || '');
async function saveStageRow(row) {
  if (navigator.onLine) {
    try {
      const r = await S.sb.from('stage_logs').upsert(row, { onConflict: 'user_id,day,stage' }).select().single();
      if (!r.error || !isNetErr(r.error)) return r;
    } catch (e) { if (!isNetErr(e)) return { data: null, error: e }; }
  }
  const q = readQ().filter(x => !(x.user_id === row.user_id && x.day === row.day && x.stage === row.stage)); q.push(row); writeQ(q);
  setTimeout(() => toast('No internet. Saved on this phone; it will send by itself when you are back online.'), 400);
  return { data: { ...row, id: 'local-' + row.stage + '-' + row.day, updated_at: new Date().toISOString(), _pending: true }, error: null };
}
let flushing = false;
async function flushQueue() {
  if (flushing || !S.sb || !S.me || !navigator.onLine) return;
  const q = readQ(); if (!q.length) return;
  flushing = true; let sent = 0; const keep = [];
  for (const row of q) {
    try {
      const { data, error } = await S.sb.from('stage_logs').upsert(row, { onConflict: 'user_id,day,stage' }).select().single();
      if (error) { if (isNetErr(error)) keep.push(row); else toast(`Couldn't send your ${STAGES[row.stage] ? STAGES[row.stage].label : row.stage} for ${fmtDay(row.day)}: ${errMsg(error)}`, 'err'); continue; }
      sent++; S.stage = S.stage.filter(l => !(l.user_id === row.user_id && l.day === row.day && l.stage === row.stage)).concat(data);
    } catch (e) { keep.push(row); }
  }
  writeQ(keep); flushing = false;
  if (sent) { toast(`${sent} saved count${sent > 1 ? 's' : ''} sent`); if (['myday', 'docket', 'warehouse', 'home'].includes(S.view)) renderView(); }
}
const pendingCount = () => S.me ? readQ().length : 0;
window.addEventListener('online', () => setTimeout(flushQueue, 1500));
window.addEventListener('offline', () => toast('You are offline. You can keep saving your daily counts; they will send when you are back online.'));

/* ================= FAULTY BATTERIES TAGGED AT SWAP STATIONS =================
   a tagger (or field technician / regional manager) tags faulty batteries at a station;
   a field technician closes the job: repaired at the station, or failed and moved to the hub */
S.faults = []; S.checkins = [];
async function loadFaults() {
  const since = ymd(new Date(Date.now() - 30 * 864e5));
  const [a, b] = await Promise.all([
    S.sb.from('station_faults').select('*').order('created_at').limit(20000),
    S.sb.from('md_checkins').select('*').gte('day', since).order('created_at')
  ]);
  S.faults = a.error ? [] : a.data || []; S.checkins = b.error ? [] : b.data || [];
}
const isTagger = (p = S.me) => ((p && p.roles) || []).includes('tagger');
const canCloseTags = (p = S.me) => ((p && p.roles) || []).some(r => ['field_tech', 'rm', 'admin'].includes(r));
const stationById = id => S.stations.find(s => s.id === id);
function openAt(sid) { return Math.max(0, S.faults.filter(f => f.station_id === sid).reduce((a, f) => a + (f.kind === 'tag' ? f.qty : -(f.repaired + f.failed)), 0)); }
/* fault numbers for the stations that pass `keep` (station row → bool), in a period */
function faultStats(keep, from, to) {
  const inP = f => (!from || f.day >= from) && (!to || f.day <= to);
  const rows = S.faults.filter(f => { const s = stationById(f.station_id) || { region: f.region, sub_region: f.sub_region }; return keep(s); });
  const p = rows.filter(inP);
  const open = {}; rows.forEach(f => { open[f.station_id] = (open[f.station_id] || 0) + (f.kind === 'tag' ? f.qty : -(f.repaired + f.failed)); });
  const openList = Object.entries(open).filter(([, n]) => n > 0).map(([sid, n]) => ({ s: stationById(sid), n })).filter(x => x.s).sort((a, b) => b.n - a.n);
  return {
    tagged: p.filter(f => f.kind === 'tag').reduce((a, f) => a + f.qty, 0),
    repaired: p.filter(f => f.kind === 'close').reduce((a, f) => a + f.repaired, 0),
    failed: p.filter(f => f.kind === 'close').reduce((a, f) => a + f.failed, 0),
    open: openList.reduce((a, x) => a + x.n, 0), openList
  };
}
/* tag-job closures by one technician in a period (they count towards that technician's repaired / failed) */
function tagClosedBy(uid, from, to) {
  const c = S.faults.filter(f => f.kind === 'close' && f.user_id === uid && (!from || f.day >= from) && (!to || f.day <= to));
  return { rep: c.reduce((a, f) => a + f.repaired, 0), back: c.reduce((a, f) => a + f.failed, 0), stations: [...new Set(c.map(f => f.station_id))] };
}

const TR = { steps: [], i: 0 };

function endTour() { store.set('bo_tour_' + S.me.id + '_' + S.view, '1'); const o = $('#tourO'); if (o) o.remove(); }
function showTourStep() {

  }

    const a = faultStats(keep, today, today), m = faultStats(keep, mf, mt);
    return `Tagged faulty batteries${S.role === 'admin' ? '' : ' in ' + (S.me.region || 'your region')}:\n• still open: ${a.open}\n• tagged today: ${a.tagged}\n• this month: ${m.tagged} tagged, ${m.repaired} repaired, ${m.failed} failed to the hub` + (a.openList.length ? `\nMost waiting: ${a.openList.slice(0, 5).map(x => `${x.s.name} (${x.n})`).join(', ')}` : '');

    if (!b.length) return 'Nobody has logged this month yet.';

  }
  if (/left|holding|still|to do|pending/.test(s) && !isMgr) {
    const r = (S.me.roles || []).some(x => ['repair_tech', 'wh_tech'].includes(x)) ? techDocket(S.me.id) : null, T = r ? personTat(S.me.id) : null;
    const tags = kindOf(S.me) === 'field' ? faultStats(st => st.field_tech_id === S.me.id, null, null) : null;
    if (!r && !tags) return 'Nothing is given to you to track here.';

    return `${techs.length - not.length} of ${techs.length} have logged today.` + (not.length ? `\nNot yet: ${not.slice(0, 20).map(p => firstName(p.full_name)).join(', ')}${not.length > 20 ? '…' : ''}` : '');

  if (/yesterday/.test(s) && !isMgr) { const k = mdMyStage(); if (!k) return 'Nothing to count for your role.'; const n = logsOf(k, yf, yf).filter(l => l.user_id === S.me.id).reduce((a, l) => a + STAGE_SCORE[k](l.data || {}), 0) + (k === 'field' ? tagClosedBy(S.me.id, yf, yf).rep : 0); return `Yesterday you ${SCORE_NOUN[k]} ${n}.`; }

    const t = logsOf(k, today, today).some(l => l.user_id === S.me.id);
    return `This month you ${SCORE_NOUN[k]} ${n}.${t ? ' You have logged today ✓' : ' You have not logged today yet.'}` + (k === 'repair' ? `\n${fmtTat(tatSummary(personTat(S.me.id), mf, mt))}` : '');

    if ((S.me.roles || []).includes('rm')) { const ids = new Set(scopeIds().map(p => p.id)), ls = logsOf('field', today, today).filter(l => ids.has(l.user_id)), f = faultStats(st => st.region === S.me.region, today, today); return `${S.me.region} today: ${ls.reduce((a, l) => a + (l.data.repaired || 0), 0) + f.repaired} repaired at stations, ${ls.reduce((a, l) => a + (l.data.failed_back || 0), 0) + f.failed} failed back, ${ls.length} of ${ids.size} technicians logged, ${f.open} tagged batteries open.`; }

/* --- check-ins: ask once a day when someone is behind --- */
function mdLagQuestion() {
  const asked = k => store.get('bo_md_asked_' + S.me.id + '_' + k) === todayStr(), hour = new Date().getHours();
  if (S.role === 'admin' || S.role === 'viewer') return null;            // the supervisor receives the answers
  if (S.role === 'mgr') return mdMgrQuestion(asked, hour);
  if (!isTechProfileWork()) return null;
  const mgr = S.me.reports_to || (kindOf(S.me) === 'field' ? 'your regional manager' : 'the supervisor');
  const k = mdMyStage(); if (!k) return null;
  const loggedToday = logsOf(k, todayStr(), todayStr()).some(l => l.user_id === S.me.id);
  if (!loggedToday && hour >= 15 && !asked('nolog')) return { key: 'nolog', who: mgr, q: "You haven't logged today. What's holding you back?", options: ['No batteries given to me', 'Waiting for spares', 'Tools or power problem', 'I was on another task', 'Off / sick today', "I'll log before I leave"], tip: 'Remember to log before you leave.' };
  if (k === 'repair') { const T = personTat(S.me.id); if (T.overdue && !asked('tat')) return { key: 'tat', who: mgr, q: `${T.overdue} of your batteries are past the ${tatTarget()}-day target. Why are they taking long?`, options: ['Waiting for spares', 'Hard fault, still diagnosing', 'Too many given to me', 'Tools or equipment', 'Waiting for test'], tip: 'Ask your SPOC if you need help.' }; }
  if (k === 'field') { const old = faultStats(st => st.field_tech_id === S.me.id, null, null).openList.filter(x => S.faults.some(f => f.station_id === x.s.id && f.kind === 'tag' && !recent(f.day, 1))); if (old.length && !asked('tags')) return { key: 'tags', who: mgr, q: `Tagged batteries at ${old.map(x => x.s.name).slice(0, 3).join(', ')} have waited more than a day. What's stopping you?`, options: ['Transport to the station', 'Waiting for spares', 'Too many stations today', 'Station closed', 'Will close them today'] }; }
  const [mf, mt] = periodRange('month'), b = mdBoard(k, mf, mt), pos = b.findIndex(o => o.uid === S.me.id);
  if (new Date().getDate() >= 5 && b.length >= 4 && pos >= Math.ceil(b.length * 2 / 3) && !asked('rank')) return { key: 'rank', who: mgr, q: `You are #${pos + 1} of ${b.length} this month. What would help you do more?`, options: ['More batteries given to me', 'Spares', 'Better tools', 'Training on hard faults', "Nothing, I'll catch up"] };
  return null;
}
/* managers are asked too: regional managers about their region, SPOCs about their brand */
function mdMgrQuestion(asked, hour) {
  const r = S.me.roles || [], who = 'the supervisor';
  if (r.includes('rm')) {
    const area = areaOf(S.me), keep = st => st.region === S.me.region && (!area || st.sub_region === area || (person(st.field_tech_id) || {}).sub_region === area);
    const old = faultStats(keep, null, null).openList.filter(x => S.faults.some(f => f.station_id === x.s.id && f.kind === 'tag' && !recent(f.day, 1)));
    if (old.length && !asked('rm_tags')) return { key: 'rm_tags', who, q: `${old.reduce((a, x) => a + x.n, 0)} tagged batteries in ${area ? areaName(area) : S.me.region} have waited more than a day (${old.slice(0, 3).map(x => x.s.name).join(', ')}). What is slowing the closing?`, options: ['Not enough technicians', 'Transport', 'Waiting for spares', 'Stations far apart', 'Will be closed today'] };
    const techs = S.peopleList.filter(p => isTechProfile(p) && kindOf(p) === 'field' && p.region === S.me.region && (!area || p.sub_region === area)), done = new Set(logsOf('field', todayStr(), todayStr()).map(l => l.user_id));
    if (hour >= 16 && techs.length && done.size < techs.length / 2 && !asked('rm_log')) return { key: 'rm_log', who, q: `Only ${techs.filter(t => done.has(t.id)).length} of ${techs.length} of your technicians have logged today. What is happening?`, options: ['Network problems', 'They are still in the field', 'Some are off today', 'I will follow up now'] };

  }
  return null;
}

  if ($('#raQ')) $('#raQ').oninput = e => { const q = e.target.value.toLowerCase(); $$('#raList li').forEach(li => li.classList.toggle('hidden', q && !li.dataset.n.includes(q))); };
  $('#raF').onsubmit = async e => {
    e.preventDefault(); const f = e.target, err = m => { $('#raErr').textContent = m; $('#raErr').classList.remove('hidden'); };
    const name = f.name.value.trim(), phone = f.phone.value.trim(), st = $$('[name=st]:checked').map(c => c.value);
    if (name.split(/\s+/).length < 2) return err('Enter first and last name.');
    if (phone.replace(/\D/g, '').length < 9) return err('Enter a valid phone number.');
    const btn = f.querySelector('button:not([type=button])'); busy(btn, true);
    const { error } = await S.sb.rpc('rm_add_technician', { p_name: name, p_phone: phone, p_stations: st.length ? st : null });
    busy(btn, false); if (error) return err(errMsg(error));
    closeModal(); toast(`${firstName(name)} sent to the supervisor for approval`); S.myRequests = null; renderTeamHub();
  };
}

/* ================= IoT TEAM: monthly numbers like the repair lines, and the lead corrects "offline at IoT" =================
   stock corrections (stock_adjust) are +/- numbers a team lead or the supervisor enters for the stock at their stage */
S.adj = []; S.adjOk = false;
async function loadAdjust() {
  const r = await S.sb.from('stock_adjust').select('*').order('created_at');
  S.adjOk = !r.error; S.adj = r.error ? [] : r.data || [];
}
const adjOf = (k, b) => S.adj.filter(a => a.stage === k && a.brand === b).reduce((s, a) => s + (a.delta || 0), 0);
const isIotPerson = (p = S.me) => ((p && p.roles) || []).some(r => ['iot', 'iot_test'].includes(r));
const canAdjust = k => S.adjOk && (S.role === 'admin' || (isLead() && STAGES[k].roles.some(r => (S.me.roles || []).includes(r))));
const iotOfflineOf = b => whNumbers(null, null, [b]).iotOffline;
/* batteries handed to air leak and not tested yet */
const airWaitingOf = b => Math.max(0, stageInflow('air_leak', b) - tSum(logsOf('air_leak'), 'tested', [b]));
const STOCK_FIX = { iot: { title: 'Batteries offline at IoT now', of: iotOfflineOf, btn: 'Correct offline at IoT', what: 'offline batteries are really at IoT', flow: 'found offline, brought back online, sent to fabrication' },
                    air_leak: { title: 'Batteries waiting for air leak test now', of: airWaitingOf, btn: 'Correct waiting for air leak', what: 'batteries are really waiting for the air leak test', flow: 'handed over by IoT, tested' } };
const stockFixBtn = (k, cls = 'h-9') => canAdjust(k) ? `<button type="button" data-adj="${k}" class="${btnS} ${cls}"><i class="fa-solid fa-pen"></i>${STOCK_FIX[k].btn}</button>` : '';

/* the IoT lead (or supervisor) sets "offline at IoT" to what is really there */
function adjustIotForm(after) { adjustStockForm('iot', after); }
function adjustStockForm(k, after) {
  const F = STOCK_FIX[k], cur = Object.fromEntries(TEAMS.map(b => [b, F.of(b)]));
  openModal(`${modalHead(F.title)}<form id="adjF" class="p-5 space-y-4" novalidate>
    <p class="text-sm text-espresso-600">Enter how many ${F.what} right now, per brand. The difference is saved as a correction. What your team logs every day (${F.flow}) keeps adding and taking away from this number.</p>
    <div class="space-y-2">${TEAMS.map(b => `<label class="flex items-center gap-3 p-2.5 rounded-xl border border-cream-200"><span class="flex-1"><b>${b}</b><span class="block text-xs text-espresso-500">now showing ${cur[b]}</span></span><span class="w-24">${numIn('n_' + b, cur[b], b + ' offline now')}</span></label>`).join('')}</div>
    ${txtIn('note', '', 'Why are you correcting it?', 'e.g. counted the shelf, opening stock')}
    <p id="adjErr" class="hidden text-sm text-terra-700"></p>
    <div class="flex justify-end gap-2"><button type="button" data-close class="${btnS}">Cancel</button><button class="${btnP}"><i class="fa-solid fa-floppy-disk"></i>Save</button></div></form>`);
  $('#adjF').onsubmit = async e => {
    e.preventDefault(); const f = e.target, err = m => { $('#adjErr').textContent = m; $('#adjErr').classList.remove('hidden'); };
    const rows = TEAMS.map(b => ({ stage: k, brand: b, delta: n0(f['n_' + b].value) - cur[b], note: f.note.value.trim() || null })).filter(r => r.delta);
    if (!rows.length) return err('Nothing changed.');
    const btn = f.querySelector('button:not([type=button])'); busy(btn, true);
    const { data, error } = await S.sb.from('stock_adjust').insert(rows).select();
    busy(btn, false); if (error) return err(errMsg(error));
    S.adj.push(...(data || rows)); closeModal(); toast(k === 'iot' ? 'Offline at IoT updated' : 'Waiting for air leak updated'); (after || renderView)();
  };
}

/* IoT numbers for a period: what came in offline, what went back online, per person */
function iotNumbers(from, to, brands = TEAMS) {
  const L = logsOf('iot', from, to), g = whNumbers(from, to, brands);
  const ppl = {}, air = ls => brands.reduce((a, b) => a + iotToAir(b, ls), 0);
  L.forEach(l => { const r = ppl[l.user_id] = ppl[l.user_id] || { checked: 0, online: 0, offline: 0, recovered: 0, fab: 0, air: 0, days: 0 };
    r.days++; ['checked', 'online', 'offline', 'recovered'].forEach(k => r[k] += tSum([l], k, brands)); r.fab += tSum([l], 'to_fab', brands); r.air += air([l]); });
  return { checked: tSum(L, 'checked', brands), online: tSum(L, 'online', brands), offline: tSum(L, 'offline', brands), recovered: tSum(L, 'recovered', brands), fab: tSum(L, 'to_fab', brands), air: air(L), stillOffline: g.iotOffline, ppl };
}
function iotPanel(from, to, plabel, brands = TEAMS, after) {
  const n = iotNumbers(from, to, brands);
  const members = S.peopleList.filter(p => p.active !== false && isIotPerson(p));
  const rows = members.map(m => [m, n.ppl[m.id] || { checked: 0, online: 0, offline: 0, recovered: 0, fab: 0, air: 0, days: 0 }]).sort((a, b) => b[1].recovered - a[1].recovered || b[1].checked - a[1].checked);
  const box = (l, v, c, sub) => `<div class="rounded-xl bg-cream-100 p-3"><div class="text-xs text-espresso-500">${l}</div><div class="font-display text-2xl font-semibold tnum ${c}">${v}</div>${sub ? `<div class="text-[11px] text-espresso-500">${sub}</div>` : ''}</div>`;
  return panel('IoT team', `<div class="grid grid-cols-2 md:grid-cols-5 gap-2">
      ${box('Received as offline', n.offline, 'text-terra', plabel)}
      ${box('Brought back online', n.recovered, 'text-olive-700', plabel)}
      ${box('Handed to air leak', n.air, 'text-olive-700', plabel)}
      ${box('Sent to fabrication', n.fab, '', plabel)}
      ${box('Still offline at IoT', n.stillOffline, 'text-terra', 'right now')}
    </div>
    ${canAdjust('iot') ? `<div class="mt-3 flex flex-wrap items-center gap-2 text-sm"><span class="text-espresso-500 flex-1">Not matching what is on the shelf?</span>${stockFixBtn('iot')}</div>` : ''}
    ${rows.length ? `<div class="overflow-x-auto mt-4"><table class="w-full text-sm min-w-[32rem]"><thead><tr class="text-espresso-500"><th class="text-left font-medium pb-2">Who</th><th class="font-medium pb-2 text-right">Checked</th><th class="font-medium pb-2 text-right">Online</th><th class="font-medium pb-2 text-right">Found offline</th><th class="font-medium pb-2 text-right">Brought online</th><th class="font-medium pb-2 text-right">To air leak</th><th class="font-medium pb-2 text-right">To fabrication</th><th class="font-medium pb-2 text-right">Days logged</th></tr></thead>
      <tbody>${rows.map(([m, r]) => `<tr class="border-t border-cream-100 ${m.id === S.me.id ? 'bg-caramel-100/60' : ''}"><td class="py-2"><span class="flex items-center gap-2">${avatar(m, 'w-8 h-8 text-[11px]')}<span class="font-medium">${esc(m.full_name)}${m.id === S.me.id ? ' (you)' : ''}${isLead(m) ? ' <span class="text-xs text-caramel-700">lead</span>' : ''}</span></span></td><td class="text-right tnum">${r.checked}</td><td class="text-right tnum">${r.online}</td><td class="text-right tnum text-terra">${r.offline}</td><td class="text-right tnum font-semibold text-olive-700">${r.recovered}</td><td class="text-right tnum">${r.air}</td><td class="text-right tnum">${r.fab}</td><td class="text-right tnum">${r.days}</td></tr>`).join('')}</tbody></table></div>` : ''}`, '', plabel);
}
function bindIot(after) { $$('[data-adj]').forEach(b => b.onclick = () => adjustStockForm(b.dataset.adj, after)); }

/* nobody can bring back online more than is offline at IoT (stops two people counting the same batteries) */
function iotRecoverCheck(d) {
  const t = d.t || {}, others = S.stage.filter(l => l.stage === 'iot' && notMineToday(l));
  for (const b of TEAMS) {
    const x = t[b] || {}; if (!x.recovered) continue;
    const pool = tSum(others, 'offline', [b]) + openingOf('iot', b, false) - tSum(others, 'recovered', [b]) - tSum(others, 'to_fab', [b]) + (x.offline || 0) - (x.to_fab || 0);
    if (x.recovered > Math.max(0, pool)) return `${b}: only ${Math.max(0, pool)} offline batteries are at IoT, so you can't bring back ${x.recovered}. If someone in your team already logged them, don't log them again.`;
  }
  return '';
}

/* IoT people's home page */
function renderIotHome() {
  const [from, to, plabel] = periodRange(WH.period), n = iotNumbers(from, to), me = n.ppl[S.me.id] || { checked: 0, recovered: 0, offline: 0, fab: 0 };
  const given = memberGiven('iot', S.me.id), done = memberDone('iot', S.me.id);
  setTitle('Home', `${fmtDay(todayStr())} · ${plabel}`);
  $('#main').innerHTML = `<div class="p-4 md:p-6 space-y-5">
    <div class="flex flex-wrap items-center gap-2">${periodBar(renderIotHome, false)}<span class="h-10 px-3 rounded-xl bg-caramel-100 text-caramel-800 text-sm font-semibold inline-flex items-center gap-2"><i class="fa-solid fa-tower-broadcast"></i>IoT team</span></div>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
      ${stageAlloc('iot').length ? statCard('Still to check', Math.max(0, given - done), 'fa-list-check', 'bg-caramel-100 text-caramel-800', `${given} given to you · ${done} checked`) : statCard('You checked', me.checked, 'fa-list-check', 'bg-caramel-100 text-caramel-800', plabel)}
      ${statCard('You brought online', me.recovered, 'fa-circle-check', 'bg-olive-50 text-olive-700', plabel)}
      ${statCard('You found offline', me.offline, 'fa-plug-circle-xmark', 'bg-terra-50 text-terra', plabel)}
      ${statCard('Offline at IoT now', n.stillOffline, 'fa-tower-broadcast', 'bg-terra-50 text-terra', 'whole team')}
    </div>
    ${iotPanel(from, to, plabel, TEAMS, renderIotHome)}
  </div>`;
  bindPeriod(renderIotHome); bindIot(renderIotHome); appendMyMonths();
}

/* ---- tagged faulty batteries: tap the card to see the stations ---- */
const TAGV = { keep: () => true, from: null, to: null, plabel: '' };
function tagListModal(mode) {
  const { keep, from, to, plabel } = TAGV;
  if (mode === 'open') {
    const st = faultStats(keep, null, null);
    const since = sid => { const t = S.faults.filter(f => f.station_id === sid && f.kind === 'tag'); return t.length ? t[t.length - 1] : null; };
    openModal(`${modalHead(`Tagged, still open · ${st.open}`)}<div class="p-5">${st.openList.length ? `<ul class="divide-y divide-cream-100">${st.openList.map(x => { const last = since(x.s.id);
      return `<li class="py-2.5 flex items-center gap-3"><span class="flex-1 min-w-0"><span class="block font-medium">${esc(x.s.name)}</span><span class="block text-xs text-espresso-500">${esc([x.s.sub_region ? areaName(x.s.sub_region) : '', x.s.region].filter(Boolean).join(' · '))} · ${x.s.field_tech_id ? esc(personName(x.s.field_tech_id)) : 'not assigned'}${last ? ` · last tagged ${fmtDay(last.day)} by ${esc(firstName(personName(last.user_id)))}${last.note ? ' (' + esc(last.note) + ')' : ''}` : ''}</span></span><span class="tnum font-display text-xl font-semibold text-terra">${x.n}</span>${canCloseTags() ? `<button data-close-tag="${x.s.id}" class="${btnS} h-9">Close job</button>` : ''}</li>`; }).join('')}</ul>` : '<p class="text-sm text-espresso-500">No tagged batteries waiting. 👍</p>'}</div>`);
    $$('#modal [data-close-tag]').forEach(b => b.onclick = () => { closeModal(); closeTagForm(b.dataset.closeTag); });
    return;
  }
  const rows = {}; S.faults.filter(f => (!from || f.day >= from) && (!to || f.day <= to)).forEach(f => { const s = stationById(f.station_id); if (!s || !keep(s)) return;
    const r = rows[s.id] = rows[s.id] || { s, tagged: 0, repaired: 0, failed: 0 }; if (f.kind === 'tag') r.tagged += f.qty; else { r.repaired += f.repaired; r.failed += f.failed; } });
  const list = Object.values(rows).sort((a, b) => b.tagged - a.tagged);
  openModal(`${modalHead(`Tagged stations · ${plabel}`)}<div class="p-5">${list.length ? `<table class="w-full text-sm"><thead><tr class="text-espresso-500"><th class="text-left font-medium pb-2">Station</th><th class="font-medium pb-2 text-right">Tagged</th><th class="font-medium pb-2 text-right">Repaired</th><th class="font-medium pb-2 text-right">Failed → hub</th><th class="font-medium pb-2 text-right">Open now</th></tr></thead><tbody>${list.map(r => `<tr class="border-t border-cream-100"><td class="py-2"><span class="block font-medium">${esc(r.s.name)}</span><span class="block text-xs text-espresso-500">${esc([r.s.sub_region ? areaName(r.s.sub_region) : '', r.s.region].filter(Boolean).join(' · '))}</span></td><td class="text-right tnum">${r.tagged}</td><td class="text-right tnum text-olive-700">${r.repaired}</td><td class="text-right tnum text-terra">${r.failed}</td><td class="text-right tnum font-semibold">${openAt(r.s.id)}</td></tr>`).join('')}</tbody></table>` : '<p class="text-sm text-espresso-500">Nothing tagged in this period.</p>'}</div>`);
}
/* a stat card you can tap to see the stations */
const tagCard = (mode, label, val, icon, tone, sub) => `<button type="button" data-taglist="${mode}" class="text-left rounded-2xl h-full hover:ring-2 hover:ring-caramel-400/50 focus:outline-none focus:ring-2 focus:ring-caramel-500 transition" aria-label="${esc(label)}: see the stations">${statCard(label, val, icon, tone, sub + ' · tap to see stations').replace('class="bg-surface', 'class="h-full bg-surface')}</button>`;
function bindTagCards(keep, from, to, plabel) { Object.assign(TAGV, { keep, from, to, plabel }); $$('[data-taglist]').forEach(b => b.onclick = () => tagListModal(b.dataset.taglist)); }

/* IoT hands online batteries over to air leak. Before this field existed (12 Nov 2026) every online battery counted as handed over. */
const AIR_HANDOVER_FROM = '2026-11-13';
function iotToAir(b, logs = logsOf('iot')) {
  return logs.reduce((a, l) => { const t = (l.data || {}).t || {}, x = t[b] || {};
    const usesField = l.day >= AIR_HANDOVER_FROM || TEAMS.some(br => ((t[br] || {}).to_air || 0) > 0);
    return a + (usesField ? (x.to_air || 0) : (x.online || 0) + (x.recovered || 0)); }, 0);
}
/* nobody can hand over more than has come online at IoT (whole team, all days) */
function iotToAirCheck(d) {
  const t = d.t || {}, others = S.stage.filter(l => l.stage === 'iot' && notMineToday(l));
  for (const b of TEAMS) {
    const x = t[b] || {}; if (!x.to_air) continue;
    const online = tSum(others, 'online', [b]) + tSum(others, 'recovered', [b]) + (x.online || 0) + (x.recovered || 0);
    const given = iotToAir(b, others);   // earlier days: every online battery already counted as handed over
    if (x.to_air > online - given) return `${b}: only ${Math.max(0, online - given)} online batteries are at IoT waiting to go to air leak, so you can't hand over ${x.to_air}.`;
  }
  return '';
}

/* ================= EARLIER DAYS: log a day you missed, from the start of last month up to yesterday =================
   a day can be logged once; after saving, earlier days can't be changed (the database enforces this too) */
S.logDay = null;
const logDay = () => S.logDay || todayStr();
const isPastDay = () => !!S.logDay && S.logDay < todayStr();
function pastMin() { const t = new Date(todayStr() + 'T12:00:00'); return ymd(new Date(t.getFullYear(), t.getMonth() - 1, 1, 12)); }
const myLogOn = (stage, day) => S.stage.find(l => l.stage === stage && l.user_id === S.me.id && l.day === day);
function dayBar(stages) {
  const past = isPastDay();
  const missed = (() => { const out = []; for (let d = new Date(pastMin() + 'T12:00:00'); ymd(d) < todayStr(); d.setDate(d.getDate() + 1)) { const day = ymd(d); if (d.getDay() !== 0 && stages.some(s => !myLogOn(s, day))) out.push(day); } return out; })();
  return `<div class="rounded-2xl border ${past ? 'border-warn-300 bg-warn-50' : 'border-cream-200 bg-surface'} p-3 flex flex-wrap items-center gap-2 text-sm">
    <span class="font-medium"><i class="fa-regular fa-calendar"></i> Logging for</span>
    <input id="logDay" type="date" min="${pastMin()}" max="${todayStr()}" value="${logDay()}" class="h-10 rounded-xl border border-cream-300 bg-surface px-3 text-sm" aria-label="Day to log">
    ${past ? `<button id="logToday" type="button" class="${btnS} h-10">Back to today</button><span class="w-full text-xs text-warn-800">You are filling in an earlier day: ${fmtDay(S.logDay)}. Enter what was done that day. Once saved it can't be changed.</span>`
      : `<span class="text-xs text-espresso-500">${missed.length ? `${missed.length} earlier day${missed.length > 1 ? 's' : ''} not logged since ${fmtDay(pastMin())} (Sundays skipped). Pick a date to fill one in.` : 'Missed a day? Pick the date to fill it in.'}</span>`}
  </div>`;
}
function bindDayBar(after) {
  if ($('#logDay')) $('#logDay').onchange = e => { const v = e.target.value; if (!v || v < pastMin() || v > todayStr()) { toast(`Pick a day from ${fmtDay(pastMin())} to today`, 'err'); e.target.value = logDay(); return; } S.logDay = v === todayStr() ? null : v; after(); };
  if ($('#logToday')) $('#logToday').onclick = () => { S.logDay = null; after(); };
}
/* what an earlier day looks like once it is saved */
const pastSaved = (ex, k) => `<div class="rounded-xl border border-cream-200 bg-cream-100 p-3 text-sm"><div class="text-xs font-semibold text-espresso-500 mb-1">SAVED FOR ${esc(fmtDay(ex.day).toUpperCase())}</div>${k === 'field' ? `Repaired <b>${ex.data.repaired || 0}</b> · failed back <b>${ex.data.failed_back || 0}</b> · ${(ex.data.stations || []).length} stations${ex.data.blockers ? ` · blockers: ${esc(ex.data.blockers)}` : ''}` : savedSummary(ex.data)}${ex.note ? `<div class="mt-1 text-xs"><b>Note:</b> ${esc(ex.note)}</div>` : ''}<div class="mt-1.5 text-xs text-espresso-500">Earlier days can't be changed once saved. Ask the supervisor if something is wrong.</div></div>`;

/* ================= BOOT ================= */
(async function boot() {
  if (!window.supabase || !window.supabase.createClient) {
    $('#boot').innerHTML = '<div class="text-center px-6"><i class="fa-solid fa-wifi text-3xl text-terra"></i><p class="mt-3 font-semibold">Could not load Battery Ops</p><p class="text-sm text-espresso-600 mt-1">Check your internet connection, then refresh the page.</p><button onclick="location.reload()" class="' + btnP + ' mt-4">Try again</button></div>';
    return;
  }
  S.sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'bo-auth' } });
  S.sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT' && S.loaded) { S.loaded = false; showAuth('login', 'You were signed out. Sign in again.'); } });
  try {
    const { data } = await S.sb.auth.getSession();
    if (data && data.session && data.session.user) { S.user = data.session.user; return await afterLogin(false); }
  } catch (e) { console.warn(e); }
  showAuth('login');
})();
</script>
