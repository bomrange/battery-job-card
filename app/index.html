<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Battery Ops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
:root{--navy:#1F3864;--navy2:#2B4A80;--blue:#2E75B6;--teal:#0F7C8C;--amber:#8A6D00;--orange:#C55A11;--green:#548235;--purple:#7030A0;--red:#B42318;--ok:#2F7D4F;
--bg:#F4F6F9;--card:#fff;--ink:#1d2433;--muted:#5f6b7d;--line:#dde2ea;--soft:#F7F9FC;--r:12px}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}a{color:var(--blue)}
.splash{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--navy);font-weight:700;font-size:18px}
.splash .logo{width:64px;height:64px;border-radius:18px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:32px}
/* login */
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,#1F3864 0%,#2B4A80 55%,#F4F6F9 55%)}
.auth .box{background:#fff;border-radius:18px;box-shadow:0 10px 40px rgba(15,25,50,.18);width:100%;max-width:400px;padding:28px}
.auth h1{margin:6px 0 2px;font-size:22px;color:var(--navy)}.auth .sub{color:var(--muted);margin-bottom:18px;font-size:13px}
.brandrow{display:flex;align-items:center;gap:10px}.brandrow .logo{width:42px;height:42px;border-radius:12px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px}
/* layout */
.top{position:sticky;top:0;z-index:30;background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px}
.top .menu{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:8px;width:36px;height:36px;cursor:pointer;font-size:18px}
.top .ttl{font-weight:700;font-size:16px}.top .ttl small{display:block;font-weight:500;font-size:11px;opacity:.75;letter-spacing:.05em}
.top .me{margin-left:auto;display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px}
.shell{display:flex;min-height:calc(100vh - 56px)}
.side{width:230px;background:#fff;border-right:1px solid var(--line);padding:12px 8px;flex-shrink:0;position:sticky;top:56px;height:calc(100vh - 56px);overflow-y:auto}
.side a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:500;margin-bottom:2px}
.side a:hover{background:var(--soft)}.side a.on{background:#E8EEF8;color:var(--navy);font-weight:700}
.side a .ic{width:22px;text-align:center}.side a .badge{margin-left:auto}
.side .sec{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.06em;margin:14px 12px 6px}
main{flex:1;min-width:0;padding:18px;max-width:1240px}
@media (max-width:900px){.side{position:fixed;left:0;top:56px;z-index:40;transform:translateX(-100%);transition:transform .2s;box-shadow:4px 0 20px rgba(0,0,0,.15)}.side.open{transform:none}main{padding:12px}}
@media (min-width:901px){.top .menu{display:none}}
.scrim{position:fixed;inset:56px 0 0 0;background:rgba(0,0,0,.25);z-index:35;display:none}.scrim.on{display:block}
/* common */
h2.pg{margin:0 0 4px;font-size:20px}.pgsub{color:var(--muted);margin:0 0 14px;font-size:13px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.panel h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grow{flex:1}.right{margin-left:auto}
.muted{color:var(--muted)}.small{font-size:12px}.tiny{font-size:11px}.b{font-weight:700}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:600;white-space:nowrap;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:#b9c2d0}.btn.p{background:var(--navy);border-color:var(--navy);color:#fff}.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.big{padding:12px 18px;font-size:15px}.btn.sm{padding:5px 10px;font-size:12px}.btn.danger{color:var(--red);border-color:#f0c2bd}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.block{width:100%;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.badge{background:var(--red);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:1px 7px}
input[type=text],input[type=tel],input[type=password],input[type=number],input[type=date],input[type=datetime-local],input[type=search],select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:#fff}
textarea{min-height:70px;resize:vertical}input:focus,select:focus,textarea:focus{outline:2px solid #9DB9E6;border-color:#9DB9E6}
label.f{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}.grid .wide{grid-column:1/-1}
.opts{display:flex;flex-wrap:wrap;gap:6px}.opts label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 11px;cursor:pointer;background:#fff;font-size:13px;user-select:none}
.opts input{margin:0;accent-color:var(--navy)}.opts label:has(input:checked){background:#E8EEF8;border-color:#9DB9E6;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.tile{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;border-top:4px solid var(--navy);cursor:default}
.tile.link{cursor:pointer}.tile.link:hover{box-shadow:0 2px 10px rgba(20,30,50,.08)}
.tile .v{font-size:24px;font-weight:700;line-height:1.1}.tile .k{font-size:12px;color:var(--muted);font-weight:600}
table.t{width:100%;border-collapse:collapse;font-size:13px}table.t th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:600;padding:7px 8px;border-bottom:2px solid var(--line);white-space:nowrap}
table.t td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
table.t tr.click{cursor:pointer}table.t tr.click:hover td{background:var(--soft)}.tw{overflow-x:auto}
.av{width:34px;height:34px;border-radius:50%;object-fit:cover;flex-shrink:0;background:#c9d3e3;color:var(--navy);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.av.lg{width:84px;height:84px;font-size:28px}.av.sm{width:26px;height:26px;font-size:11px}.av.xs{width:22px;height:22px;font-size:10px}
.person{display:inline-flex;align-items:center;gap:8px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:10px;padding:10px 12px;cursor:pointer}
.item:hover{box-shadow:0 2px 8px rgba(20,30,50,.08)}.item .id{font-weight:700;font-size:15px}.item .meta{font-size:12px;color:var(--muted)}
.empty{text-align:center;padding:28px 10px;color:var(--muted)}
.banner{padding:10px 14px;border-radius:10px;margin-bottom:12px;font-size:13px}.banner.warn{background:#FFF4E5;border:1px solid #F5C27A;color:#7A4A00}.banner.err{background:#FDECEA;border:1px solid #F4B4AE;color:var(--red)}.banner.ok{background:#DCF0E3;border:1px solid #9CD3B0;color:#1f5d38}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:600}.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.ann{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:#fff;border-left:5px solid var(--navy)}
.ann.recognition{border-left-color:#C9A227;background:#FFFBEA}.ann.promotion{border-left-color:var(--purple);background:#F6F0FB}
.ann h4{margin:0 0 4px;font-size:15px}.ann .body{white-space:pre-wrap;font-size:13.5px}
.lb{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.lb:last-child{border-bottom:0}.lb .rank{width:22px;font-weight:700;color:var(--muted);text-align:center}
.lb .rank.g1{color:#C9A227}.lb .rank.g2{color:#8A8F99}.lb .rank.g3{color:#A0643C}
.bar{height:9px;border-radius:5px;background:var(--blue)}
.filters{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin-bottom:12px}
.filters label{font-size:11px;font-weight:600;color:var(--muted)}
#map{height:420px;border-radius:10px;border:1px solid var(--line)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(15,22,35,.45);z-index:60;display:flex;justify-content:center;overflow-y:auto;padding:24px 12px}
.sheet{background:var(--bg);border-radius:14px;max-width:900px;width:100%;align-self:flex-start;overflow:hidden}
.sheet .hd{background:var(--navy);color:#fff;padding:14px 18px;display:flex;gap:12px;align-items:flex-start}
.sheet .bd{padding:16px}.xbtn{margin-left:auto;background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:600}
.hist{background:#fff;border:1px solid var(--line);border-left:5px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px}
.hist h4{margin:0 0 6px;font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:4px 14px;font-size:12.5px}.kv div b{color:var(--muted);font-weight:600}.kv .wide{grid-column:1/-1}
.action{border:2px solid var(--blue);border-radius:12px;background:#fff;padding:16px;margin-top:6px}.action h3{margin:0 0 10px;font-size:15px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:22px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1d2433;color:#fff;padding:10px 16px;border-radius:10px;z-index:80;font-weight:600;font-size:13px;display:none;max-width:90vw}
.gps{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px;border-radius:999px;background:var(--soft);border:1px solid var(--line)}
.gps.ok{background:#DCF0E3;border-color:#9CD3B0;color:#1f5d38}.gps.bad{background:#FDECEA;border-color:#F4B4AE;color:var(--red)}
.foot{font-size:11px;color:var(--muted);text-align:center;padding:20px 0 6px}
.photo-drop{display:flex;flex-direction:column;align-items:center;gap:12px;padding:10px}
.topsearch{flex:1;max-width:420px;margin-left:16px;display:flex;align-items:center;background:rgba(255,255,255,.12);border-radius:9px;padding:0 4px 0 0}
.topsearch input{background:transparent!important;border:0!important;color:#fff!important;padding:8px 10px!important}
.topsearch input::placeholder{color:#c9d4ea}.topsearch input:focus{outline:none!important}
.scanbtn{background:transparent;border:0;color:#fff;font-size:16px;cursor:pointer;padding:4px 6px}
@media (max-width:700px){.top{flex-wrap:wrap}.topsearch{order:3;flex-basis:100%;max-width:none;margin:6px 0 0}.top .me span{display:none}}
.tl{position:relative;padding-left:18px;border-left:3px solid var(--line);margin-left:6px}
.tl .ev{position:relative;margin-bottom:10px}.tl .ev:before{content:'';position:absolute;left:-26px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--dot,#2E75B6);border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.scanbox{position:relative;background:#000;border-radius:12px;overflow:hidden}.scanbox video{width:100%;display:block}
.scanbox .aim{position:absolute;left:12%;right:12%;top:38%;height:24%;border:3px solid #39d353;border-radius:10px}
@media (max-width:700px){.side{top:104px;height:calc(100vh - 104px)}.scrim{inset:104px 0 0 0}}

</style>
</head>
<body>
<div id="app"><div class="splash"><div class="logo">⚡</div><div>Battery Ops</div></div></div>
<div id="modal"></div>
<div id="toast"></div>
<script>
// ================= CONFIG =================
const SB_URL = 'https://vlpxhjsjjzqnecjdylqt.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZscHhoanNqanpxbmVjamR5bHF0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQyMzY0NjUsImV4cCI6MjEwOTgxMjQ2NX0.Kn2EOPU7Zsqas9oV9Fq76OF0S1Eoc2Mj8A1rYLTK4x8';
const EMAIL_DOMAIN = '@staff.batteryops.internal';
const REPEAT_DAYS = 30;

const ROLE_LABEL = { admin:'Super admin', rm:'Regional manager', field_tech:'Field technician', receiving:'Receiving', store:'Store keeper',
  diagnosis:'Diagnosis', spoc:'Brand SPOC', repair_tech:'Repair technician', qc:'QC engineer', tester:'Air leak / insulation',
  dispatch:'Dispatch', iot:'IoT (offline to online)', fabrication:'Fabrication', data_view:'Data & reports', wh_tech:'Warehouse technician' };
const ROLES = Object.keys(ROLE_LABEL);
const BRANDS = ['CBAK','Ampace','Greenway'];
const PREFIX = { C:'CBAK', A:'Ampace', D:'Greenway' };
const BRAND_COLOR = { CBAK:'#2E75B6', Ampace:'#C55A11', Greenway:'#548235', Other:'#666' };
const REGIONS = ['Central','Eastern','Northern','Western'];
const WAREHOUSES = ['Main warehouse','Luzira warehouse','Bukoto Solar Hub'];
const STAGES = [
  { key:'diagnosis', label:'Diagnosis', color:'#8A6D00', tint:'#FFF2CC' },
  { key:'assign',    label:'Waiting for assignment', short:'Assign', color:'#5B6B85', tint:'#E7EAEE' },
  { key:'repair',    label:'Repair', color:'#2E75B6', tint:'#DEEBF7' },
  { key:'spares',    label:'Waiting for spares', short:'Spares', color:'#A15C00', tint:'#FFE9CC' },
  { key:'qc',        label:'Quality check', short:'QC', color:'#C55A11', tint:'#FBE5D6' },
  { key:'test',      label:'Air leak & insulation', short:'Testing', color:'#548235', tint:'#E2EFDA' },
  { key:'dispatch',  label:'Dispatch', color:'#7030A0', tint:'#EADCF4' },
  { key:'closed',    label:'Closed', color:'#2F7D4F', tint:'#DCF0E3' },
];
const ST = Object.fromEntries(STAGES.map(s => [s.key, s]));
const FAULTS = [['F01','BMS fault / no communication'],['F02','Cell imbalance (high delta)'],['F03','Dead / low-voltage cell'],['F04','Charging port damage'],
  ['F05','Discharge connector / terminal damage'],['F06','Broken weld / busbar'],['F07','Fuse / MOSFET failure'],['F08','Water ingress / corrosion'],
  ['F09','Casing / seal damage (air leak)'],['F10','Insulation failure'],['F11','Firmware / IoT module issue'],['F12','No fault found (NFF)']];
const FAULT_NAME = Object.fromEntries(FAULTS);
const TOOLS_REPAIR = ['Multimeter','Battery analyser','Laptop + BMS software','Spot welder','Soldering iron','Crimping tool','Heat gun','Screwdriver / torque set','Balancer / charger'];
const TOOLS_DIAG = ['Multimeter','Battery analyser','Laptop + BMS software','Insulation tester'];
const TOOLS_QC = ['Multimeter','Battery analyser','Laptop + BMS software','Charger / discharger','IR thermometer'];
const TOOLS_TEST = ['Air leak tester','Insulation tester (megger)','Pressure gauge'];
const SPARES = ['Charging port','Discharge connector','BMS board','Cells','Fuse','MOSFET','Casing / seal','IoT module','SIM card','Wiring / busbar','Other'];
const WARRANTY = { in:'Under warranty', out:'Out of warranty', unknown:'Not known' };
const ISSUE_KIND = { rack:'Smart rack not working', faulty:'High number of faulty batteries', critical:'Critical issue', visit:'Routine visit', other:'Other' };
const PRIORITY = { critical:['Critical','#B42318'], high:['High','#C55A11'], normal:['Normal','#5B6B85'] };
const QC_CHECKS = ['Pack voltage','Cell balance / delta','BMS communication','Charge / discharge','Temperature','Connectors & casing','Labels / ID'];

// ================= STATE =================
const S = { sb:null, user:null, me:null, people:{}, peopleList:[], stations:[], cards:[], logs:[], checkins:[], iot:[], issues:[], anns:[], requests:[], team:'all',
  view:'home', loaded:false, dirty:false, openCard:null, cardSig:null, tab:{}, f:{}, perfRange:'month' };

// ================= HELPERS =================
const $ = (s, el = document) => el.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const now = () => Date.now();
const pad = n => String(n).padStart(2, '0');
const ms = v => v == null ? null : (typeof v === 'number' ? v : Date.parse(v));
function fmtDT(v){ const t = ms(v); if (!t) return '—'; const d = new Date(t); return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${String(d.getFullYear()).slice(2)} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function fmtD(v){ const t = ms(v); if (!t) return '—'; const d = new Date(t); return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`; }
function dayKey(v){ const d = new Date(ms(v)); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function fmtDur(m){ if (m == null || isNaN(m)) return '—'; m = Math.round(m/60000); if (m < 60) return m + ' min'; const h = Math.floor(m/60); if (h < 48) return h + 'h ' + (m%60) + 'm'; return Math.floor(h/24) + 'd ' + (h%24) + 'h'; }
const mins = e => (e && e.inAt && e.outAt) ? Math.max(0, (e.outAt - e.inAt) / 60000) : null;
const hrs = (a, b) => (ms(a) && ms(b)) ? (ms(b) - ms(a)) / 3600000 : null;
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
const pct = v => v == null ? '—' : Math.round(v * 100) + '%';
const num1 = v => v == null ? '—' : (Math.round(v * 10) / 10).toString();
const openEntry = arr => { const l = (arr || []).at(-1); return l && !l.outAt ? l : null; };
const lastDone = arr => [...(arr || [])].reverse().find(e => e.outAt);
const brandOf = id => PREFIX[(String(id || '').trim()[0] || '').toUpperCase()] || 'Other';
function toast(msg, long){ const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = 'none', long ? 6000 : 2800); }
function lsGet(k, d){ try { return localStorage.getItem(k) ?? d; } catch(e){ return d; } }
function lsSet(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
function chip(text, bg, fg = '#fff'){ return `<span class="chip" style="background:${bg};color:${fg}">${esc(text)}</span>`; }
const brandChip = b => b ? chip(b, BRAND_COLOR[b] || '#666') : '';
const stageChip = k => { const s = ST[k] || ST.diagnosis; return chip(s.short || s.label, s.color); };
const has = r => !!S.me && (S.me.roles || []).includes(r);
const hasAny = rs => rs.some(has);
const isAdmin = () => has('admin');
const canSeeIot = () => hasAny(['admin','rm','receiving','store','diagnosis','qc','tester','dispatch','iot','fabrication','data_view','wh_tech']);
const myWh = () => S.me?.warehouse || null;
const reportsToMe = p => !!p && !!S.me && (p.reports_to || '').trim().toLowerCase() === S.me.full_name.trim().toLowerCase();
const person = id => S.people[id] || null;
const nameOf = id => person(id)?.full_name || (id ? 'Unknown' : '—');
const initials = n => (n || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
function avatar(id, cls = ''){ const p = person(id); if (p && p.photo_url) return `<img class="av ${cls}" src="${esc(p.photo_url)}" alt="">`; return `<span class="av ${cls}">${esc(initials(p?.full_name))}</span>`; }
function avatarP(p, cls = ''){ if (p && p.photo_url) return `<img class="av ${cls}" src="${esc(p.photo_url)}" alt="">`; return `<span class="av ${cls}">${esc(initials(p?.full_name))}</span>`; }
const who = (id, cls = 'xs') => id ? `<span class="person">${avatar(id, cls)}${esc(nameOf(id))}</span>` : '—';
const stationName = id => S.stations.find(s => s.id === id)?.name || '';
function checks(name, items, sel = []){ return `<div class="opts">${items.map(i => `<label><input type="checkbox" name="${name}" value="${esc(i)}" ${sel.includes(i) ? 'checked' : ''}>${esc(i)}</label>`).join('')}</div>`; }
function radios(name, items, sel, req = true){ return `<div class="opts">${items.map(([v, l], i) => `<label><input type="radio" name="${name}" value="${esc(v)}" ${sel === v ? 'checked' : ''} ${req && i === 0 ? 'required' : ''}>${esc(l)}</label>`).join('')}</div>`; }
function options(items, sel, blank){ return (blank != null ? `<option value="">${esc(blank)}</option>` : '') + items.map(i => { const [v, l] = Array.isArray(i) ? i : [i, i]; return `<option value="${esc(v)}" ${String(sel) === String(v) ? 'selected' : ''}>${esc(l)}</option>`; }).join(''); }
const fd = form => { const f = new FormData(form); const g = k => (f.get(k) || '').toString().trim(); g.all = k => f.getAll(k); return g; };
function rangeOf(key, from, to){
  const d = new Date(); d.setHours(0, 0, 0, 0); const day = 86400000; const t0 = d.getTime();
  if (key === 'today') return [t0, t0 + day];
  if (key === 'yesterday') return [t0 - day, t0];
  if (key === '7') return [t0 - 6*day, t0 + day];
  if (key === '30') return [t0 - 29*day, t0 + day];
  if (key === 'month') return [new Date(d.getFullYear(), d.getMonth(), 1).getTime(), t0 + day];
  if (key === 'lastmonth') return [new Date(d.getFullYear(), d.getMonth()-1, 1).getTime(), new Date(d.getFullYear(), d.getMonth(), 1).getTime()];
  if (key === 'all') return [0, t0 + day];
  const f = from ? Date.parse(from + 'T00:00') : t0; const tt = to ? Date.parse(to + 'T00:00') + day : t0 + day; return [f, tt];
}
function getGPS(){
  return new Promise(res => {
    if (!navigator.geolocation) return res({ error:'This phone or browser cannot share location' });
    navigator.geolocation.getCurrentPosition(p => res({ lat:p.coords.latitude, lng:p.coords.longitude, accuracy:Math.round(p.coords.accuracy) }),
      e => res({ error: e.code === 1 ? 'Location permission was refused' : 'Could not get location (' + e.message + ')' }),
      { enableHighAccuracy:true, timeout:20000, maximumAge:30000 });
  });
}
async function resizeImage(file, size = 320){
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
  const c = document.createElement('canvas'); c.width = c.height = size; const s = Math.min(img.width, img.height);
  c.getContext('2d').drawImage(img, (img.width - s)/2, (img.height - s)/2, s, s, 0, 0, size, size);
  return await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
}

async function savePin(form){
  const g = fd(form); if (g('p1') !== g('p2')) return renderChangePin(S.me.must_change_pin, 'The two PINs are different. Try again.');
  if (!/^\d{6}$/.test(g('p1'))) return renderChangePin(S.me.must_change_pin, 'The PIN must be exactly 6 digits.');
  if (/^(\d)\1{5}$/.test(g('p1')) || g('p1') === '123456') return renderChangePin(S.me.must_change_pin, 'That PIN is too easy to guess. Choose another.');
  const { error } = await S.sb.auth.updateUser({ password: g('p1') });
  if (error) return renderChangePin(S.me.must_change_pin, error.message);
  await S.sb.rpc('pin_changed'); const wasFirst = S.me.must_change_pin; S.me.must_change_pin = false; toast('PIN saved');
  if (wasFirst){ if (!S.me.photo_url) return renderPhotoGate(); return startApp(); }

}

async function uploadPhoto(file){

    const { error } = await S.sb.storage.from('avatars').upload(path, blob, { upsert:true, contentType:'image/jpeg' });
    if (error) throw error;
    const url = S.sb.storage.from('avatars').getPublicUrl(path).data.publicUrl + '?v=' + now();
    const r = await S.sb.rpc('set_my_photo', { p_url: url }); if (r.error) throw r.error;

async function loadAll(){
  const sb = S.sb;
  const q = [
    sb.from('profiles').select('*').order('full_name'),
    sb.from('stations').select('*').order('name'),
    sb.from('job_cards').select('*').order('received_at', { ascending:false }).limit(5000),
    sb.from('field_logs').select('*').order('created_at', { ascending:false }).limit(5000),
    sb.from('checkins').select('*').order('created_at', { ascending:false }).limit(5000),
  ];
  q.push(sb.from('station_issues').select('*').order('created_at', { ascending:false }).limit(3000));
  if (canSeeIot()) q.push(sb.from('iot_cases').select('*').order('created_at', { ascending:false }).limit(5000));
  const r = await Promise.all(q);
  const err = r.find(x => x.error); if (err) throw err.error;
  S.peopleList = r[0].data; S.people = Object.fromEntries(S.peopleList.map(p => [p.id, p]));
  S.me = S.people[S.me.id] || S.me;
  S.stations = r[1].data; S.cards = r[2].data; S.logs = r[3].data; S.checkins = r[4].data;
  S.issues = r[5].data;
  S.iot = r[6] ? r[6].data : [];
}
async function reloadTable(t){
  const map = { job_cards:['cards','received_at'], field_logs:['logs','created_at'], iot_cases:['iot','created_at'], checkins:['checkins','created_at'], station_issues:['issues','created_at'] };
  if (t === 'iot_cases' && !canSeeIot()) return;
  const [k, o] = map[t]; const { data, error } = await S.sb.from(t).select('*').order(o, { ascending:false }).limit(5000);
  if (!error){ S[k] = data; refresh(); }
}
function upsertLocal(key, row){ const a = S[key]; const i = a.findIndex(x => x.id === row.id); if (i >= 0) a[i] = row; else a.unshift(row); }
async function startApp(){
  $('#app').innerHTML = `<div class="splash"><div class="logo">⚡</div><div>Loading Battery Ops…</div></div>`;
  try { await loadAll(); } catch(e){ $('#app').innerHTML = `<div class="auth"><div class="box"><h1>Could not load</h1><p class="muted">${esc(e.message || e)}</p><button class="btn p" onclick="location.reload()">Try again</button></div></div>`; return; }
  S.loaded = true; S.sb.rpc('touch_seen');
  const ch = S.sb.channel('ops-live');
  ['job_cards','field_logs','iot_cases','station_issues'].forEach(t => ch.on('postgres_changes', { event:'*', schema:'public', table:t }, () => { clearTimeout(S['_rl' + t]); S['_rl' + t] = setTimeout(() => reloadTable(t), 600); }));
  ch.subscribe();
  setInterval(() => { reloadTable('job_cards'); reloadTable('field_logs'); }, 120000);
  setInterval(tickTimers, 1000);
  renderShell(); if (!location.hash) location.hash = '#home'; route();
}
function tickTimers(){ document.querySelectorAll('[data-since]').forEach(el => { const s = Math.max(0, Math.floor((now() - Number(el.dataset.since)) / 1000)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60; el.textContent = (h ? h + ':' + pad(m) : m) + ':' + pad(x); }); }

FORM.recv = async f => {
  const g = fd(f); const bid = g('battery').toUpperCase(); const msg = $('#recvMsg');

  const st = S.stations.find(s => s.id === g('station'));

  const b = f.querySelector('button[type=submit]'); b.disabled = true; lsSet('bo_wh', g('warehouse'));
  if (!needs.includes('repair')){
    try { await createIot({ battery_id: bid, warehouse: g('warehouse'), reason: g('offline') || g('fault'), source: 'receiving' }); S.dirty = false; toast('Sent to the IoT team'); renderMain(); }

ACT['recv-log'] = async a => {

    if (error) throw error; l.status = 'received'; l.job_card_id = card.id;

};

VIEWS.work = () => {
  const sections = [];

  if (has('repair_tech')) add('My repairs', by('repair').filter(c => c.assigned_to === S.me.id), ST.repair.color);
  if (has('spoc') && !isAdmin()) add(`${esc(S.me.team)} repairs in progress`, by('repair').filter(c => c.brand === S.me.team && c.assigned_to !== S.me.id), ST.repair.color);
  if (isAdmin()) add('In repair', by('repair'), ST.repair.color);
  const sp = by('spares').filter(c => isAdmin() || whOk(c) || c.assigned_to === S.me.id || (has('spoc') && c.brand === S.me.team) || hasAny(['store','receiving']));
  if (sp.length || has('spoc')) add('Waiting for spares', sp, ST.spares.color, 'Open a battery and press "Spares received" when the part arrives.');
  if (hasAny(['qc','admin'])) add('Waiting for QC', by('qc'), ST.qc.color);
  if (hasAny(['tester','admin'])) add('Waiting for air leak & insulation test', by('test'), ST.test.color);
  if (hasAny(['dispatch','admin','receiving','store'])) add('Ready for dispatch', by('dispatch'), ST.dispatch.color);
  if (has('wh_tech')) STAGES.filter(s => s.key !== 'closed').forEach(s => { const l = by(s.key).filter(whOk); if (l.length) add(`${esc(myWh())} · ${s.label}`, l, s.color); });

  if (has('fabrication') && !sections.length) add('Open job cards (add your work as a note)', S.cards.filter(c => c.status !== 'closed'), '#1F3864');
  return `<h2 class="pg">My work</h2><p class="pgsub">Batteries waiting for you, oldest first. Open one, press Start when you pick it up and Submit when you hand it on.</p>${sections.join('') || '<div class="panel empty">You have no warehouse queue.</div>'}`;
};

// ================= JOB CARD DETAIL =================
ACT['open-card'] = a => openCard(a.dataset.id);
function openCard(id){ S.openCard = id; S.cardSig = null; S.cardDirty = false; renderCard(true); }
function closeCard(){ S.openCard = null; S.cardSig = null; $('#modal').innerHTML = ''; document.body.style.overflow = ''; if (!S.dirty) renderMain(); renderNav(); }
ACT['close-card'] = () => closeCard();
ACT['ov-bg'] = (a, e) => { if (e.target === a) closeCard(); };
document.addEventListener('input', e => { if (e.target.closest('#modal form')) S.cardDirty = true; });
function sigOf(c){ return c ? [c.status, c.assigned_to, c.updated_at].join('|') : ''; }
function renderCard(force){
  const c = S.cards.find(x => x.id === S.openCard); if (!c){ closeCard(); return; }
  const sig = sigOf(c);
  if (!force && (sig === S.cardSig || S.cardDirty)) return;
  S.cardSig = sig; S.cardDirty = false; document.body.style.overflow = 'hidden';
  const end = c.status === 'closed' ? ms(c.closed_at) : now();
  $('#modal').innerHTML = `<div class="ov" data-act="ov-bg"><div class="sheet">
    <div class="hd"><div><div class="small" style="opacity:.8">${esc(c.jc_no)} · ${esc(c.warehouse || '')}</div>
      <div style="font-size:22px;font-weight:700">${esc(c.battery_id)}</div>
      <div class="row" style="gap:6px;margin-top:4px">${brandChip(c.brand)}${stageChip(c.status)}${c.is_repeat ? chip('REPEAT REPAIR', '#B42318') : ''}<span class="small" style="opacity:.85">${c.status === 'closed' ? 'Turnaround' : 'In warehouse'} ${fmtDur(end - ms(c.received_at))}</span></div></div>
      <div class="row" style="margin-left:auto;gap:6px;flex-wrap:nowrap"><button class="xbtn" style="margin-left:0" data-act="battery" data-id="${esc(c.battery_id)}">🔎 Battery history</button><button class="xbtn" style="margin-left:0" data-act="close-card">Close ✕</button></div></div>
    <div class="bd">${cardHistory(c)}${cardAction(c)}${notesBlock(c)}</div></div></div>`;
}
function kv(pairs){ return `<div class="kv">${pairs.filter(p => p[1] !== undefined && p[1] !== null && p[1] !== '' && !(Array.isArray(p[1]) && !p[1].length)).map(([k, v, w]) => `<div class="${w ? 'wide' : ''}"><b>${esc(k)}:</b> ${esc(Array.isArray(v) ? v.join(', ') : v)}</div>`).join('')}</div>`; }
function histBox(color, label, sub, body){ return { html: `<div class="hist" style="border-left-color:${color}"><h4>${chip(label, color)} <span class="muted small">${sub}</span></h4>${body}</div>` }; }
function cardHistory(c){
  const d = c.data || {}; const items = [];
  if (c.is_repeat && c.repeat_of){ const p = S.cards.find(x => x.id === c.repeat_of); items.push({ t:0, html:`<div class="banner err"><b>Repeat repair.</b> This battery was closed ${p ? fmtDT(p.closed_at) + ' on ' + esc(p.jc_no) : 'recently'}${p && lastDone(p.data?.repairs) ? ', repaired by ' + esc(nameOf(lastDone(p.data.repairs).who)) : ''}. ${p ? `<a href="#" data-act="open-card" data-id="${p.id}">Open previous job card</a>` : ''}</div>` }); }
  if (d.field) items.push({ t: d.field.at || 1, ...histBox('#0F7C8C', 'SWAP STATION', `${fmtDT(d.field.at)} · ${nameOf(d.field.tech)} · ${esc(stationName(c.station_id))}`,
    kv([['Fault reported', d.field.fault, true], ['Reported by', d.field.reported], ['Voltage', d.field.voltage ? d.field.voltage + ' V' : ''], ['SoC', d.field.soc ? d.field.soc + '%' : ''], ['Damage', d.field.damage]]) + (d.field.lat ? `<div class="small"><a href="https://maps.google.com/?q=${d.field.lat},${d.field.lng}" target="_blank" rel="noopener">📍 Where it was logged</a></div>` : '')) });
  if (d.receive) items.push({ t: d.receive.at || 2, ...histBox('#44546A', 'RECEIVED', `${fmtDT(d.receive.at)} · ${esc(nameOf(d.receive.by))}`, kv([['Fault reported', d.receive.fault, true], ['Voltage', d.receive.voltage ? d.receive.voltage + ' V' : ''], ['SoC', d.receive.soc ? d.receive.soc + '%' : ''], ['Damage', d.receive.damage]])) });
  (d.diagnosis || []).forEach(e => e.outAt && items.push({ t: e.outAt, ...histBox(ST.diagnosis.color, 'DIAGNOSIS', `${esc(nameOf(e.who))} · ${fmtDT(e.inAt)} → ${fmtDT(e.outAt)} · <b>${Math.round(mins(e))} min</b>`,
    kv([['Fault codes', (e.faults || []).map(f => f + ' ' + (FAULT_NAME[f] || ''))], ['Warranty', WARRANTY[e.warranty]], ['Findings', e.findings, true], ['Tools', e.tools, true]])) }));
  (d.assignments || []).forEach(e => items.push({ t: e.at, ...histBox(ST.assign.color, 'ASSIGNED', `${fmtDT(e.at)} · by ${esc(nameOf(e.by))}`, `<div class="small">To ${who(e.to)}</div>`) }));
  (d.repairs || []).forEach((e, i) => e.outAt && items.push({ t: e.outAt, ...histBox(ST.repair.color, 'REPAIR · attempt ' + (i + 1), `${esc(nameOf(e.who))} · ${fmtDT(e.inAt)} → ${fmtDT(e.outAt)} · <b>${Math.round(mins(e))} min</b> · ${e.result === 'repaired' ? 'sent to QC' : e.result === 'vendor' ? 'return to vendor' : e.result === 'spares' ? 'waiting for spares' : 'scrap'}`,
    kv([['Fault codes', (e.faults || []).map(f => f + ' ' + (FAULT_NAME[f] || ''))], ['Issue found', e.issue, true], ['Action taken', e.action, true], ['Tools', e.tools, true], ['Spares', e.spares, true], ['Voltage after', e.voltAfter ? e.voltAfter + ' V' : ''], ['Cell delta', e.delta ? e.delta + ' mV' : '']])) }));
  (d.spares || []).forEach(e => items.push({ t: e.at + 1, ...histBox(ST.spares.color, e.receivedAt ? 'SPARES RECEIVED' : 'WAITING FOR SPARES', `${fmtDT(e.at)} · ${esc(nameOf(e.by))}${e.receivedAt ? ' · received ' + fmtDT(e.receivedAt) + ' by ' + esc(nameOf(e.receivedBy)) + ' · waited ' + fmtDur(e.receivedAt - e.at) : ''}`, kv([['Spare needed', e.part + (e.qty ? ' × ' + e.qty : '')], ['Note', e.note, true]])) }));
  (d.qcs || []).forEach((e, i) => e.outAt && items.push({ t: e.outAt, ...histBox(ST.qc.color, 'QC · round ' + (i + 1), `${esc(nameOf(e.who))} · ${fmtDT(e.outAt)} · <b>${Math.round(mins(e))} min</b> · ${e.verdict === 'pass' ? '<b style="color:#2F7D4F">PASS</b>' : '<b style="color:#B42318">FAIL</b>'}`,
    kv([['Checks', e.checks, true], ['Pack voltage', e.v ? e.v + ' V' : ''], ['Cell delta', e.delta ? e.delta + ' mV' : ''], ['Temp', e.temp ? e.temp + ' °C' : ''], ['Findings', e.findings, true], ['Reason for return', e.reason, true]])) }));
  (d.tests || []).forEach((e, i) => e.outAt && items.push({ t: e.outAt, ...histBox(ST.test.color, 'AIR LEAK & INSULATION · round ' + (i + 1), `${esc(nameOf(e.who))} · ${fmtDT(e.outAt)} · <b>${Math.round(mins(e))} min</b> · Air ${e.airResult === 'pass' ? 'PASS' : 'FAIL'} · Insulation ${e.insResult === 'pass' ? 'PASS' : 'FAIL'}`,
    kv([['Test pressure', e.pressure], ['Hold time', e.hold ? e.hold + ' s' : ''], ['Leak / drop', e.leak], ['Test voltage', e.insV], ['Insulation', e.insReading ? e.insReading + ' MΩ' : ''], ['Minimum', e.insMin ? e.insMin + ' MΩ' : '']])) }));
  if (d.dispatch) items.push({ t: d.dispatch.at, ...histBox(ST.closed.color, 'DISPATCHED & CLOSED', `${fmtDT(d.dispatch.at)} · ${esc(nameOf(d.dispatch.who))}`,
    kv([['Final status', { deploy:'Ready for deployment', vendor:'Returned to vendor (warranty claim)', scrap:'Scrapped' }[d.dispatch.finalStatus]], ['Destination', d.dispatch.destination], ['Hands-on time', Math.round(handsOn(c)) + ' min'], ['Turnaround', fmtDur(ms(c.closed_at) - ms(c.received_at))], ['Note', d.dispatch.note, true]])) });
  items.sort((a, b) => a.t - b.t);
  return items.map(i => i.html).join('');
}
function handsOn(c){ const d = c.data || {}; return [...(d.diagnosis || []), ...(d.repairs || []), ...(d.qcs || []), ...(d.tests || [])].map(mins).filter(v => v != null).reduce((a, b) => a + b, 0); }
function canAct(c){
  if (isAdmin()) return true;
  if (c.status !== 'closed' && whOk(c)) return true;
  if (c.status === 'diagnosis') return has('diagnosis');
  if (c.status === 'assign') return has('spoc') && c.brand === S.me.team;
  if (c.status === 'repair') return c.assigned_to === S.me.id;
  if (c.status === 'spares') return c.assigned_to === S.me.id || (has('spoc') && c.brand === S.me.team) || hasAny(['store']);
  if (c.status === 'qc') return has('qc') && (c.warehouse === 'Main warehouse' || !c.warehouse || !S.peopleList.some(p => (p.roles || []).includes('wh_tech') && p.warehouse === c.warehouse));
  if (c.status === 'test') return has('tester');

}
function stageField(c){ return { diagnosis:'diagnosis', repair:'repairs', qc:'qcs', test:'tests' }[c.status]; }
function startBlock(c, color, title){
  return `<div class="action" style="border-color:${color}"><h3 style="color:${color}">${title}</h3>

    <div class="small muted" style="margin-top:6px">The clock runs from Start until you submit. Your name is recorded automatically.</div></div>`;
}
function runHead(e, color){ return `<div class="row" style="margin-bottom:12px;background:var(--soft);border-radius:10px;padding:10px 12px"><div class="grow">${who(e.who, 'sm')} <span class="small muted">started ${fmtDT(e.inAt)}</span></div><div style="text-align:right"><div class="small muted">Time on this battery</div><div class="timer" style="color:${color}" data-since="${e.inAt}">0:00</div></div></div>`; }

  if (c.status === 'diagnosis'){

    return `<div class="action" style="border-color:${ST.diagnosis.color}"><h3 style="color:${ST.diagnosis.color}">Diagnosis</h3>${runHead(e, ST.diagnosis.color)}

  }

      <div class="wide"><label class="f">Action taken *</label><textarea name="action" required></textarea></div>
      <div class="wide"><label class="f">Tools used *</label>${checks('tools', TOOLS_REPAIR)}</div>

function metrics(){
  const cards = filterCards(false); const f = S.f;
  const techs = {}, qcs = {}, testers = {}, diags = {}, faults = {}, days = {};
  const T = (id, brand) => techs[id] ||= { id, brand, cards:new Set(), attempts:0, minutes:[], returned:0, fp:0, fpBase:0, repeats:0, assigned:0, pending:0 };
  const D = k => days[k] ||= { day:k, received:0, closed:0, repairs:0, qcPass:0, qcFail:0, tests:0, repeats:0 };
  let received = 0, closed = [], repeatsList = [];
  for (const c of cards){
    const d = c.data || {}; const reps = (d.repairs || []).filter(e => e.outAt); const qr = (d.qcs || []).filter(e => e.outAt); const tr = (d.tests || []).filter(e => e.outAt);
    const techBefore = t => [...reps].reverse().find(e => e.outAt <= t)?.who;
    if (inRange(c.received_at)){ received++; D(dayKey(c.received_at)).received++; if (c.is_repeat){ D(dayKey(c.received_at)).repeats++; repeatsList.push(c); } }
    if (c.status === 'repair' && c.assigned_to) T(c.assigned_to, c.brand).pending++;
    (d.assignments || []).forEach(a => { if (inRange(a.at)) T(a.to, c.brand).assigned++; });
    for (const e of (d.diagnosis || []).filter(e => e.outAt)){ if (!inRange(e.outAt)) continue; const o = diags[e.who] ||= { id:e.who, done:0, minutes:[] }; o.done++; const m = mins(e); if (m != null) o.minutes.push(m); (e.faults || []).forEach(x => faults[x] = (faults[x] || 0) + 1); }
    for (const e of reps){
      if (!inRange(e.outAt)) continue;
      const t = T(e.who, c.brand); t.attempts++; t.cards.add(c.id); const m = mins(e); if (m != null) t.minutes.push(m); D(dayKey(e.outAt)).repairs++;
      if (!(d.diagnosis || []).length) (e.faults || []).forEach(x => faults[x] = (faults[x] || 0) + 1);
      if (e.result === 'repaired'){ t.fpBase++; const nq = qr.find(q => q.outAt >= e.outAt); if (nq && nq.verdict === 'pass') t.fp++; }
    }
    for (const q of qr){ if (!inRange(q.outAt)) continue; const o = qcs[q.who] ||= { id:q.who, checked:0, passed:0, failed:0, minutes:[], reasons:{} }; o.checked++;
      if (q.verdict === 'pass'){ o.passed++; D(dayKey(q.outAt)).qcPass++; } else { o.failed++; D(dayKey(q.outAt)).qcFail++; if (q.reason) o.reasons[q.reason] = (o.reasons[q.reason] || 0) + 1; const tb = techBefore(q.outAt); if (tb) T(tb, c.brand).returned++; }
      const m = mins(q); if (m != null) o.minutes.push(m); }
    for (const x of tr){ if (!inRange(x.outAt)) continue; const o = testers[x.who] ||= { id:x.who, tested:0, airPass:0, insPass:0, failed:0, minutes:[] }; o.tested++; D(dayKey(x.outAt)).tests++;
      if (x.airResult === 'pass') o.airPass++; if (x.insResult === 'pass') o.insPass++;
      if (!(x.airResult === 'pass' && x.insResult === 'pass')){ o.failed++; const tb = techBefore(x.outAt); if (tb) T(tb, c.brand).returned++; }
      const m = mins(x); if (m != null) o.minutes.push(m); }
    if (c.status === 'closed' && inRange(c.closed_at)){ closed.push(c); D(dayKey(c.closed_at)).closed++; }
    if (c.is_repeat && inRange(c.received_at) && c.repeat_of){ const p = S.cards.find(x => x.id === c.repeat_of); const lt = p && lastDone(p.data?.repairs); if (lt) T(lt.who, p.brand).repeats++; }
  }
  const tat = closed.map(c => hrs(c.received_at, c.closed_at)).filter(v => v != null);
  const fieldTat = closed.filter(c => c.data?.field?.at).map(c => hrs(c.data.field.at, c.closed_at));
  const hands = closed.map(handsOn);
  // field
  const logs = S.logs.filter(l => inRange(l.created_at) && (!f.region || l.region === f.region) && (!f.station || l.station_id === f.station) && (!f.person || l.tech_id === f.person));
  const cis = S.checkins.filter(l => inRange(l.created_at) && (!f.region || l.region === f.region) && (!f.station || l.station_id === f.station) && (!f.person || l.tech_id === f.person));
  const ft = {};
  const FT = id => ft[id] ||= { id, logs:0, fixed:0, sent:0, checkins:0, stations:new Set(), noGps:0, last:null };
  logs.forEach(l => { const o = FT(l.tech_id); o.logs++; if (l.action === 'fixed') o.fixed++; else o.sent++; if (!l.lat) o.noGps++; if (!o.last || ms(l.created_at) > ms(o.last.created_at)) o.last = l; });
  cis.forEach(c => { const o = FT(c.tech_id); o.checkins++; if (c.station_id) o.stations.add(c.station_id); if (!c.lat) o.noGps++; if (!o.last || ms(c.created_at) > ms(o.last.created_at)) o.last = c; });
  const tf = a => a.filter(x => inTeam(x.id));
  return { cards, received, closed, tat, fieldTat, hands, techs:tf(Object.values(techs)), qcs:tf(Object.values(qcs)), testers:tf(Object.values(testers)), diags:tf(Object.values(diags)), faults, days:Object.values(days).sort((a, b) => a.day < b.day ? 1 : -1), repeatsList, logs, cis, ft:tf(Object.values(ft)), iot:tf(iotMetrics()),
    qcRate: (() => { const a = Object.values(qcs); const n = a.reduce((s, x) => s + x.checked, 0); return n ? a.reduce((s, x) => s + x.passed, 0) / n : null; })(),
    testRate: (() => { const a = Object.values(testers); const n = a.reduce((s, x) => s + x.tested, 0); return n ? a.reduce((s, x) => s + x.tested - x.failed, 0) / n : null; })() };
}

function techTable(M){

  let html = '';
  for (const b of [...BRANDS, ...Object.keys(by).filter(x => !BRANDS.includes(x))]){
    const list = (by[b] || []).sort((x, y) => y.cards.size - x.cards.size); if (!list.length) continue;
    html += `<div class="panel"><h3>${brandChip(b)} repair technicians</h3><div class="tw"><table class="t"><tr><th>Technician</th><th class="n">Assigned</th><th class="n">Batteries closed</th><th class="n">Pending now</th><th class="n">Returned (QC/test)</th><th class="n">Repeat repairs</th><th class="n">Avg min / battery</th><th class="n">QC first-pass</th></tr>
      ${list.map(t => { const fp = t.fpBase ? t.fp / t.fpBase : null; return `<tr class="click" data-act="person" data-id="${t.id}"><td>${who(t.id, 'sm')}</td><td class="n">${t.assigned}</td><td class="n"><b>${t.cards.size}</b></td><td class="n">${t.pending}</td><td class="n" style="${t.returned ? 'color:#B42318;font-weight:700' : ''}">${t.returned}</td><td class="n" style="${t.repeats ? 'color:#B42318;font-weight:700' : ''}">${t.repeats}</td><td class="n">${t.minutes.length ? Math.round(avg(t.minutes)) : '—'}</td><td class="n" style="color:${fp == null ? 'inherit' : fp >= .85 ? '#2F7D4F' : '#B42318'};font-weight:700">${pct(fp)}</td></tr>`; }).join('')}</table></div></div>`;

  return html || '<div class="panel empty">No warehouse work in this period yet.</div>';
}

const IOT_ST = {
  isolated:    { label:'Isolated — waiting', color:'#8A6D00', tint:'#FFF2CC' },
  in_progress: { label:'Being worked on', color:'#2E75B6', tint:'#DEEBF7' },
  online:      { label:'Back online', color:'#2F7D4F', tint:'#DCF0E3' },

};
const IOT_ACTIONS = ['Opened and checked IoT unit','Firmware upgrade','SIM card swap','IoT module replaced','Antenna / cable fixed','Re-configured / re-registered on platform'];
async function createIot(row){
  const bid = row.battery_id.toUpperCase();

  <div class="tiles">${tile('Warehouse repairs', s.cards.filter(c => (c.data?.repairs || []).some(e => e.outAt)).length, '#2E75B6')}${tile('Fixed at swap station', s.fixedOnSite, '#0F7C8C')}${tile('Times sent to warehouse', s.logs.filter(l => l.action === 'sent').length + s.cards.filter(c => !c.field_log_id).length, '#44546A')}
    ${tile('Repeat repairs', s.repeats, '#B42318')}${tile('Returned to vendor', s.vendor, '#7030A0')}${tile('Last repaired', s.lastRepair ? fmtD(s.lastRepair.outAt) : '—', '#2F7D4F')}${s.spares.length ? tile('Waiting for spares', esc(s.spares.map(x => x.part).join(', ')), '#A15C00') : ''}</div>
  <div class="panel"><h3>History</h3><div class="tabs">${[['all','Everything'],['station','Swap station'],['warehouse','Warehouse'],['iot','IoT']].map(([v, l]) => `<button data-act="batt-f" data-v="${v}" class="${f === v ? 'on' : ''}">${l} (${v === 'all' ? ev.length : ev.filter(e => e.where === v).length})</button>`).join('')}</div>
  <div class="tl">${shown.map(e => `<div class="ev" style="--dot:${e.color}">${e.card ? `<div class="hist" style="border-left-color:${e.color};cursor:pointer" data-act="open-card" data-id="${e.card}">` : e.iot ? `<div class="hist" style="border-left-color:${e.color};cursor:pointer" data-act="open-iot" data-id="${e.iot}">` : `<div class="hist" style="border-left-color:${e.color}">`}${e.html}</div></div>`).join('') || '<div class="empty">No records.</div>'}</div></div>`;
}
ACT['batt-f'] = a => { S.battFilter = a.dataset.v; renderMain(); };
// ================= BARCODE SCANNER =================
ACT.scan = async a => {
  const target = a.dataset.target;
  const findInput = () => target === 'topq' ? $('.topsearch input') : target === 'q2' ? $('form[data-form=search2] input') : a.closest('form')?.querySelector(`input[name="${target}"]`);
  if (!('BarcodeDetector' in window) || !navigator.mediaDevices?.getUserMedia){ toast('Scanning is not supported on this phone or browser — please type the battery ID.', true); findInput()?.focus(); return; }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }); }
  catch(e){ toast('Camera permission was refused.', true); return; }
  const prev = $('#modal').innerHTML;
  $('#modal').insertAdjacentHTML('beforeend', `<div class="ov" id="scanOv"><div class="sheet" style="max-width:460px"><div class="hd"><div class="b">Scan battery label</div><button class="xbtn" id="scanX">Close ✕</button></div><div class="bd"><div class="scanbox"><video id="scanV" playsinline muted></video><div class="aim"></div></div><div class="small muted" style="margin-top:8px">Point the camera at the barcode or QR code on the battery.</div></div></div></div>`);
  const v = $('#scanV'); v.srcObject = stream; await v.play().catch(() => {});
  let done = false; const stop = () => { done = true; stream.getTracks().forEach(t => t.stop()); $('#scanOv')?.remove(); };
  $('#scanX').onclick = stop;
  const det = new BarcodeDetector();
  const tick = async () => { if (done) return; try { const r = await det.detect(v); if (r.length){ const val = r[0].rawValue.trim().toUpperCase(); stop(); const inp = findInput(); if (inp){ inp.value = val; inp.dispatchEvent(new Event('input', { bubbles: true })); }
        toast('Scanned ' + val); if (target === 'topq' || target === 'q2') inp?.form?.requestSubmit(); return; } } catch(e){} setTimeout(tick, 250); };
  tick();
};

// ================= STATIONS & SMART RACKS =================
const CRIT_FAULTY_7D = 5; // faulty batteries in 7 days that makes a station critical
function stationHealth(){
  const [t7] = rangeOf('7'); const [t30] = rangeOf('30');
  const lastCheck = {}; S.checkins.forEach(c => { if (!c.station_id) return; if (!lastCheck[c.station_id] || ms(c.created_at) > ms(lastCheck[c.station_id].created_at)) lastCheck[c.station_id] = c; });
  const lastRack = {}; S.checkins.filter(c => c.rack_status).forEach(c => { if (!lastRack[c.station_id] || ms(c.created_at) > ms(lastRack[c.station_id].created_at)) lastRack[c.station_id] = c; });
  return S.stations.map(st => {
    const logs = S.logs.filter(l => l.station_id === st.id);
    const f7 = logs.filter(l => ms(l.created_at) >= t7).length, f30 = logs.filter(l => ms(l.created_at) >= t30).length;
    const openIssues = S.issues.filter(i => i.station_id === st.id && i.status !== 'resolved');
    const rack = lastRack[st.id]?.rack_status || null;
    const rackDown = rack === 'down' || openIssues.some(i => i.kind === 'rack');
    const critical = f7 >= CRIT_FAULTY_7D || rackDown || openIssues.some(i => i.priority === 'critical');
    const last = lastCheck[st.id];
    return { st, f7, f30, openIssues, rack, rackDown, critical, last, daysSince: last ? Math.floor((now() - ms(last.created_at)) / 864e5) : null };
  });
}
function issueItem(i){
  const [pl, pc] = PRIORITY[i.priority] || PRIORITY.normal;
  const stc = i.status === 'resolved' ? chip('Resolved', '#DCF0E3', '#1f5d38') : i.status === 'assigned' ? chip('Assigned to ' + nameOf(i.assigned_to).split(' ')[0], '#DEEBF7', '#1F3864') : chip('Not assigned', '#FDECEA', '#B42318');
  return `<div class="item" data-act="open-issue" data-id="${i.id}" style="border-left-color:${pc}"><div class="grow"><div class="row" style="gap:6px"><span class="id" style="font-size:14px">${esc(stationName(i.station_id))}</span>${chip(pl, pc)}${stc}</div>
    <div class="meta">${esc(ISSUE_KIND[i.kind] || i.kind)}${i.title ? ' · ' + esc(i.title) : ''}${i.due_date ? ' · due ' + fmtD(i.due_date + 'T12:00') : ''}</div></div>
    <div class="small muted" style="text-align:right">${fmtDT(i.created_at)}<br>by ${esc(nameOf(i.reported_by).split(' ')[0])}</div></div>`;
}
VIEWS.stations = () => {
  const H = stationHealth().filter(h => (!S.stReg || h.st.region === S.stReg) && (S.stTeam !== 'mine' || reportsToMe(person(h.st.field_tech_id))));
  const t = tabs('st', [['critical','Critical stations'],['all','All stations'],['issues','Open issues'],['resolved','Resolved']], 'critical');
  const open = S.issues.filter(i => i.status !== 'resolved' && (!S.stReg || i.region === S.stReg));
  const tiles = [['Critical stations', H.filter(h => h.critical).length, '#B42318'], ['Smart racks down', H.filter(h => h.rackDown).length, '#7030A0'], ['Issues not assigned', open.filter(i => i.status === 'open').length, '#C55A11'],
    ['Assigned, in progress', open.filter(i => i.status === 'assigned').length, '#2E75B6'], ['Not visited in 7+ days', H.filter(h => h.daysSince == null || h.daysSince >= 7).length, '#8A6D00'], ['Faulty batteries (7 days)', H.reduce((n, h) => n + h.f7, 0), '#0F7C8C']];
  const row = h => `<tr${h.critical ? ' style="background:#FFF7F6"' : ''}><td><b>${esc(h.st.name)}</b>${h.critical ? ' ' + chip('CRITICAL', '#B42318') : ''}</td><td>${esc(h.st.sub_region || h.st.region || '')}</td><td>${h.st.field_tech_id ? who(h.st.field_tech_id) : '<span class="muted">none</span>'}</td>
    <td class="n" style="${h.f7 >= CRIT_FAULTY_7D ? 'color:#B42318;font-weight:700' : ''}">${h.f7}</td><td class="n">${h.f30}</td><td>${h.rack === 'down' ? chip('Down', '#B42318') : h.rack === 'partial' ? chip('Partly', '#C55A11') : h.rack === 'working' ? chip('Working', '#2F7D4F') : '<span class="muted small">not checked</span>'}</td>
    <td class="n">${h.openIssues.length}</td><td class="small">${h.last ? fmtD(h.last.created_at) + ` <span class="muted">(${h.daysSince}d)</span>` : '<span class="muted">never</span>'}</td>
    <td><button class="btn sm p" data-act="assign-station" data-id="${h.st.id}">Assign tech</button></td></tr>`;
  const table = list => `<div class="tw"><table class="t"><tr><th>Station</th><th>Region</th><th>Field tech</th><th class="n">Faulty (7d)</th><th class="n">Faulty (30d)</th><th>Smart rack</th><th class="n">Open issues</th><th>Last visit</th><th></th></tr>${list.map(row).join('') || '<tr><td colspan="9" class="empty">No stations here.</td></tr>'}</table></div>`;
  let body = '';
  if (t.cur === 'critical') body = `<div class="panel"><h3>Critical stations</h3><p class="small muted" style="margin-top:-6px">A station is critical when it has ${CRIT_FAULTY_7D}+ faulty batteries in 7 days, a smart rack down, or a critical issue open.</p>${table(H.filter(h => h.critical).sort((a, b) => b.f7 - a.f7))}</div>`;
  if (t.cur === 'all') body = `<div class="panel">${table(H.sort((a, b) => (b.critical - a.critical) || (b.f7 - a.f7) || a.st.name.localeCompare(b.st.name)))}</div>`;
  if (t.cur === 'issues') body = `<div class="list">${open.sort((a, b) => (a.status === 'open' ? -1 : 1) - (b.status === 'open' ? -1 : 1) || ms(a.created_at) - ms(b.created_at)).map(issueItem).join('') || '<div class="panel empty">No open issues.</div>'}</div>`;
  if (t.cur === 'resolved') body = `<div class="list">${S.issues.filter(i => i.status === 'resolved').slice(0, 200).map(issueItem).join('') || '<div class="panel empty">Nothing resolved yet.</div>'}</div>`;
  return `<h2 class="pg">Stations & smart racks</h2><p class="pgsub">Find stations with problems and send a technician. The technician sees it as a task and closes it with a GPS check-in.</p>
  <div class="tiles">${tiles.map(([k, v, c]) => `<div class="tile" style="border-top-color:${c}"><div class="v">${v}</div><div class="k">${k}</div></div>`).join('')}</div>
  <div class="row" style="margin-bottom:8px"><select data-chg="streg" style="width:auto">${options(REGIONS, S.stReg || '', 'All regions')}</select>${S.peopleList.some(reportsToMe) ? `<select data-chg="stteam" style="width:auto">${options([['mine','My technicians only']], S.stTeam || '', 'All technicians')}</select>` : ''}
    <button class="btn p right" data-act="assign-station" data-id="">+ New task / issue</button></div>${t.html}${body}`;
};
CHANGE.streg = el => { S.stReg = el.value; renderMain(); };
CHANGE.stteam = el => { S.stTeam = el.value; renderMain(); };
ACT['assign-station'] = a => assignForm(a.dataset.id || '', null);
function assignForm(stationId, issue){
  const st = S.stations.find(s => s.id === (issue?.station_id || stationId));
  const h = st && stationHealth().find(x => x.st.id === st.id);
  const techs = S.peopleList.filter(p => p.active && (p.roles || []).includes('field_tech')).sort((a, b) => (b.region === st?.region) - (a.region === st?.region) || a.full_name.localeCompare(b.full_name));
  const defKind = issue?.kind || (h?.rackDown ? 'rack' : h && h.f7 >= CRIT_FAULTY_7D ? 'faulty' : 'visit');
  $('#modal').innerHTML = `<div class="ov" data-act="ov-close"><div class="sheet" style="max-width:620px"><div class="hd"><div style="font-size:18px;font-weight:700">${issue ? 'Assign technician' : 'Send a technician to a station'}</div><button class="xbtn" data-act="modal-close">Close ✕</button></div>
  <div class="bd">${h ? `<div class="banner ${h.critical ? 'err' : 'warn'}"><b>${esc(st.name)}</b>: ${h.f7} faulty batteries in 7 days · smart rack ${h.rack || 'not checked'} · ${h.openIssues.length} open issue(s) · last visit ${h.last ? fmtD(h.last.created_at) : 'never'}</div>` : ''}
  <form data-form="assign-task" data-issue="${issue?.id || ''}"><div class="grid">
    <div class="wide"><label class="f">Station *</label><select name="station" required ${issue ? 'disabled' : ''}>${options(S.stations.map(s => [s.id, s.name + (s.sub_region ? ' (' + s.sub_region + ')' : '')]), st?.id || '', '— choose station —')}</select></div>
    <div><label class="f">Problem *</label><select name="kind" ${issue ? 'disabled' : ''}>${options(Object.entries(ISSUE_KIND), defKind)}</select></div>
    <div><label class="f">Priority *</label><select name="priority">${options(Object.entries(PRIORITY).map(([k, v]) => [k, v[0]]), issue?.priority || (h?.critical ? 'critical' : 'high'))}</select></div>
    <div class="wide"><label class="f">Technician *</label><select name="tech" required>${options(techs.map(p => [p.id, p.full_name + ' · ' + (p.sub_region || p.region || '') + (st && p.id === st.field_tech_id ? ' (station tech)' : '') + ' · ' + S.issues.filter(i => i.assigned_to === p.id && i.status === 'assigned').length + ' open tasks']), issue?.assigned_to || st?.field_tech_id || '', '— choose technician —')}</select></div>
    <div><label class="f">Do it by</label><input type="date" name="due" value="${issue?.due_date || new Date(now() + 864e5).toISOString().slice(0, 10)}"></div>
    <div class="wide"><label class="f">Instructions</label><input type="text" name="title" value="${esc(issue?.title || '')}" placeholder="e.g. 3 racks not charging, check power and slots"></div>
  </div><div class="row" style="margin-top:14px"><button class="btn p big" type="submit">Assign</button></div></form></div></div></div>`;
}
FORM['assign-task'] = async f => {
  const g = fd(f); const id = f.dataset.issue; const b = f.querySelector('button[type=submit]'); b.disabled = true;
  const patch = { assigned_to: g('tech'), assigned_by: S.me.id, assigned_at: new Date().toISOString(), status: 'assigned', priority: g('priority'), due_date: g('due') || null, title: g('title') || null };
  let res;
  if (id) res = await S.sb.from('station_issues').update(patch).eq('id', id).select().single();
  else { const st = S.stations.find(s => s.id === g('station')); if (!st){ b.disabled = false; return toast('Choose a station'); }
    res = await S.sb.from('station_issues').insert({ ...patch, station_id: st.id, region: st.region, kind: g('kind'), reported_by: S.me.id, data: {} }).select().single(); }
  if (res.error){ b.disabled = false; return toast('Not saved: ' + res.error.message, true); }
  upsertLocal('issues', res.data); $('#modal').innerHTML = ''; toast('Assigned to ' + nameOf(g('tech'))); renderMain(); renderNav();
};
ACT['open-issue'] = a => showIssue(a.dataset.id);
function showIssue(id){
  const i = S.issues.find(x => x.id === id); if (!i) return;
  const [pl, pc] = PRIORITY[i.priority] || PRIORITY.normal; const d = i.data || {};
  const canResolve = i.status !== 'resolved' && (i.assigned_to === S.me.id || hasAny(['admin','rm']));
  const canAssign = i.status !== 'resolved' && hasAny(['admin','rm']);
  $('#modal').innerHTML = `<div class="ov" data-act="ov-close"><div class="sheet" style="max-width:640px"><div class="hd"><div><div class="small" style="opacity:.8">${esc(ISSUE_KIND[i.kind] || i.kind)}</div><div style="font-size:20px;font-weight:700">${esc(stationName(i.station_id))}</div><div class="row" style="gap:6px;margin-top:4px">${chip(pl, pc)}${chip(i.status === 'resolved' ? 'Resolved' : i.status === 'assigned' ? 'Assigned' : 'Not assigned', '#E8EEF8', '#1F3864')}</div></div><button class="xbtn" data-act="modal-close">Close ✕</button></div>
  <div class="bd"><div class="hist" style="border-left-color:${pc}">${kv([['Reported', fmtDT(i.created_at) + ' by ' + nameOf(i.reported_by)], ['Details', i.title || d.note, true], ['Rack', d.rack ? { working:'Working', partial:'Partly working', down:'Not working' }[d.rack] : ''], ['Slots affected', d.slots], ['Assigned to', i.assigned_to ? nameOf(i.assigned_to) + ' by ' + nameOf(i.assigned_by) + ' on ' + fmtDT(i.assigned_at) : ''], ['Do it by', i.due_date ? fmtD(i.due_date + 'T12:00') : '']])}</div>
  ${i.status === 'resolved' ? `<div class="hist" style="border-left-color:#2F7D4F">${kv([['Resolved', fmtDT(i.resolved_at) + ' by ' + nameOf(d.resolvedBy)], ['What was done', d.resolution, true], ['Rack now', d.rackAfter ? { working:'Working', partial:'Partly working', down:'Still not working' }[d.rackAfter] : ''], ['Took', fmtDur(ms(i.resolved_at) - ms(i.created_at))]])}${d.lat ? `<div class="small"><a href="https://maps.google.com/?q=${d.lat},${d.lng}" target="_blank" rel="noopener">📍 Where it was closed</a></div>` : ''}</div>` : ''}
  ${canAssign ? `<button class="btn" data-act="reassign" data-id="${i.id}">${i.assigned_to ? 'Change technician' : 'Assign technician'}</button>` : ''}
  ${canResolve ? `<div class="action" style="border-color:#2F7D4F;margin-top:12px"><h3 style="color:#2F7D4F">Close this task</h3><form data-form="resolve-issue" data-id="${i.id}"><div class="grid">
    <div class="wide"><label class="f">What did you do? *</label><textarea name="res" required placeholder="e.g. replaced fuse on rack 2, collected 4 faulty batteries"></textarea></div>
    ${i.kind === 'rack' ? `<div class="wide"><label class="f">Smart rack now *</label>${radios('rackAfter', [['working','Working'],['partial','Partly working'],['down','Still not working']], '')}</div>` : ''}
    <div class="wide gpsbox">${gpsBadge()}</div></div><div class="row" style="margin-top:12px"><button class="btn ok big" type="submit">✔ Mark as done</button></div></form></div>` : ''}</div></div></div>`;
}
ACT.reassign = a => assignForm('', S.issues.find(x => x.id === a.dataset.id));
FORM['resolve-issue'] = async f => {
  const i = S.issues.find(x => x.id === f.dataset.id); const g = fd(f); const b = f.querySelector('button[type=submit]'); b.disabled = true; b.textContent = 'Getting location…';
  const gps = await ensureGPS(); const rackAfter = g('rackAfter');
  const { data, error } = await S.sb.from('station_issues').update({ status: rackAfter === 'down' ? 'assigned' : 'resolved', resolved_at: rackAfter === 'down' ? null : new Date().toISOString(),
    data: { ...(i.data || {}), resolution: g('res'), rackAfter, resolvedBy: S.me.id, lat: gps.lat ?? null, lng: gps.lng ?? null, accuracy: gps.accuracy ?? null, updates: [...(i.data?.updates || []), { by: S.me.id, at: now(), text: g('res'), rack: rackAfter }] } }).eq('id', i.id).select().single();
  if (error){ b.disabled = false; b.textContent = '✔ Mark as done'; return toast('Not saved: ' + error.message, true); }
  upsertLocal('issues', data);
  if (has('field_tech') && i.station_id) await S.sb.from('checkins').insert({ tech_id: S.me.id, station_id: i.station_id, region: i.region, lat: gps.lat ?? null, lng: gps.lng ?? null, accuracy: gps.accuracy ?? null, note: 'Task: ' + g('res'), rack_status: rackAfter || null }).select().single().then(r => { if (!r.error) upsertLocal('checkins', r.data); });
  $('#modal').innerHTML = ''; toast(rackAfter === 'down' ? 'Saved — still open because the rack is not working' : 'Task closed ✔', true); renderMain(); renderNav();
};
async function reportRack(stationId, rack, note, slots){
  const st = S.stations.find(s => s.id === stationId);
  const open = S.issues.find(i => i.station_id === stationId && i.kind === 'rack' && i.status !== 'resolved');
  if (open) return open;
  const { data, error } = await S.sb.from('station_issues').insert({ station_id: stationId, region: st?.region, kind: 'rack', priority: rack === 'down' ? 'critical' : 'high', status: 'open', title: note || null, reported_by: S.me.id, data: { rack, note, slots } }).select().single();
  if (error) throw error; upsertLocal('issues', data); return data;
}

boot();

</script>
