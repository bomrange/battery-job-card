function resizeImage(file, max = 360, q = 0.82) {
  return new Promise((res, rej) => {
    if (!file.type.startsWith('image/')) return rej(new Error('Choose a photo file'));
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error('Could not read photo')), 'image/jpeg', q);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Could not read photo')); };
    img.src = url;
  });
}

        <label class="block"><span class="text-sm font-medium">Hours</span><input name="hours" type="number" step="0.25" min="0.25" max="12" value="${j ? j.hours : 1.5}" class="${inputC} mt-1.5 tnum"></label>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <label class="block"><span class="text-sm font-medium">Deadline day</span><input name="dueDay" type="date" value="${ymd(due)}" class="${inputC} mt-1.5 px-2 tnum"></label>
        <label class="block"><span class="text-sm font-medium">Deadline time</span><input name="dueTime" type="time" value="${hhmm(due)}" class="${inputC} mt-1.5 px-2 tnum"></label>
      </div>
      <p id="jobErr" class="hidden text-sm text-terra-700 bg-terra-50 border border-terra/30 rounded-lg px-3 py-2"></p>
      <div class="flex gap-2 pt-1"><button type="button" data-close class="${btnS} flex-1">Cancel</button><button class="${btnP} flex-1">${j ? 'Save' : 'Create job'}</button></div>
    </form>`);
  $('#jobF').onsubmit = async e => {
    e.preventDefault();
    const f = e.target, err = $('#jobErr'), show = m => { err.textContent = m; err.classList.remove('hidden'); };
    const start = new Date(`${f.day.value}T${f.start.value}`), dueAt = new Date(`${f.dueDay.value}T${f.dueTime.value}`), hours = +f.hours.value;
    if (f.title.value.trim().length < 2) return show('Describe the job.');
    if (isNaN(start) || isNaN(dueAt)) return show('Check the day and times.');
    if (!(hours > 0 && hours <= 12)) return show('Hours must be between 0.25 and 12.');
    if (dueAt <= start) return show('The deadline must be after the start time.');
    const row = { title: f.title.value.trim(), fault: f.fault.value, brand: f.brand.value || null, battery_id: f.battery.value.trim().toUpperCase() || null,
      tech_id: f.tech.value || null, station_id: f.station.value || null, start_at: start.toISOString(), hours, due_at: dueAt.toISOString() };
    const b = f.querySelector('button:not([type=button])'); busy(b, true, 'Saving…');
    const res = j ? await S.sb.from('jobs').update(row).eq('id', j.id).select().single() : await S.sb.from('jobs').insert(row).select().single();
    busy(b, false);
    if (res.error) return show(errMsg(res.error));
    const saved = res.data; const i = S.jobs.findIndex(x => x.id === saved.id); if (i >= 0) S.jobs[i] = saved; else S.jobs.push(saved);
    closeModal(); toast(j ? `${saved.jc_no} saved` : `${saved.jc_no} created${saved.tech_id ? ' for ' + firstName(personName(saved.tech_id)) : ''}`);
    S.day = ymd(new Date(saved.start_at)); if (S.view === 'dispatch') renderDispatch();
    if (j) openJob(saved.id, true);
  };
}

/* Supervisor overview: every RM and SPOC, how their people are doing, one click into their dashboard */
function supervisorsHtml() {

  const t = todayStr(), mk = curMonth().slice(0, 7);
  const cards = ms.map(m => {

    const open = S.jobs.filter(j => j.status === 'open' && ids.has(j.tech_id));

    <p id="camMsg" class="hidden mt-2 text-xs text-warn-800"></p>

  $('#scanBtn').onclick = () => cam.stream ? stopCamera() : startCamera(j);

async function startCamera(j) {

  try {
    if ('BarcodeDetector' in window) {
      const f = await BarcodeDetector.getSupportedFormats();
      cam.detector = new BarcodeDetector({ formats: ['qr_code', 'code_128', 'code_39', 'ean_13', 'data_matrix', 'itf'].filter(x => f.includes(x)) });
    } else if (!window.jsQR) {
      await new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js'; s.onload = res; s.onerror = rej; document.head.appendChild(s); });

    if (!cam.stream || !v.videoWidth) { cam.timer = setTimeout(tick, 300); return; }
    let code = null;
    try {
      if (cam.detector) { const r = await cam.detector.detect(v); if (r && r[0]) code = r[0].rawValue; }
      else if (window.jsQR) { const w = 480, h = Math.round(v.videoHeight / v.videoWidth * w); c.width = w; c.height = h; ctx.drawImage(v, 0, 0, w, h); const r = jsQR(ctx.getImageData(0, 0, w, h).data, w, h); if (r) code = r.data; }
    } catch (e) {}
    if (code) { const id = String(code).trim().toUpperCase().replace(/\s+/g, '').slice(0, 24); stopCamera(); $('#scanFlash').classList.remove('hidden'); setTimeout(() => $('#scanFlash') && $('#scanFlash').classList.add('hidden'), 700); if (navigator.vibrate) navigator.vibrate(60); setScanned(id, j, true); return; }
    cam.timer = setTimeout(tick, 250);
  };
  tick();
}
function stopCamera() {

  const v = $('#camV'); if (v) { v.srcObject = null; v.classList.add('hidden'); }
  if ($('#camIdle')) $('#camIdle').classList.remove('hidden'); if ($('#camLine')) $('#camLine').classList.add('hidden');

}
function setScanned(id, j, byCam) { W.scanned = id; W.scannedByCam = byCam; showScanResult(j); toast(`Battery ${id} ${byCam ? 'scanned' : 'entered'}`); }

    <div class="mt-4 flex items-center"><span class="text-sm font-medium">Your signature</span><button id="sigClear" class="ml-auto text-sm text-caramel-700 font-medium">Clear</button></div>
    <div class="mt-1.5 rounded-xl border-2 border-dashed border-cream-300 bg-white relative"><canvas id="sig" class="w-full h-36 touch-none block rounded-xl" aria-label="Signature pad"></canvas><span id="sigHint" class="pointer-events-none absolute inset-0 grid place-items-center text-sm text-[#94705C]">Sign here with your finger</span></div>`;
  $('#outcome').onchange = e => W.outcome = e.target.value;
  $('#wNote').oninput = e => W.note = e.target.value;
  W.sigInk = false; sigCtx = null;
  const c = $('#sig'), pos = e => { const r = c.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  const setup = () => { const r = c.getBoundingClientRect(); if (!r.width) return; const d = window.devicePixelRatio || 1; c.width = Math.round(r.width * d); c.height = Math.round(r.height * d); sigCtx = c.getContext('2d'); sigCtx.setTransform(d, 0, 0, d, 0, 0); sigCtx.lineWidth = 2.4; sigCtx.lineCap = 'round'; sigCtx.lineJoin = 'round'; sigCtx.strokeStyle = '#2C1A14'; };
  c.addEventListener('pointerdown', e => { if (!sigCtx) setup(); drawing = true; last = pos(e); c.setPointerCapture(e.pointerId); });
  c.addEventListener('pointermove', e => { if (!drawing || !sigCtx) return; const p = pos(e); sigCtx.beginPath(); sigCtx.moveTo(last.x, last.y); sigCtx.lineTo(p.x, p.y); sigCtx.stroke(); last = p; if (!W.sigInk) { W.sigInk = true; $('#sigHint').classList.add('hidden'); } });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => c.addEventListener(ev, () => drawing = false));

}

function renderWizard() {

  $('#stepBars').innerHTML = STEP_NAMES.map((_, i) => `<span class="h-1.5 flex-1 rounded-full ${i <= W.step ? 'bg-caramel-400' : 'bg-white/20'}"></span>`).join('');

  $('#wizBack').disabled = W.step === 0;
  const lastStep = W.step === STEP_NAMES.length - 1;
  $('#wizNext').innerHTML = lastStep ? '<i class="fa-solid fa-paper-plane"></i>Submit job card' : `Next: ${STEP_NAMES[W.step + 1]}<i class="fa-solid fa-chevron-right"></i>`;
  $('#wizNext').className = `h-14 flex-1 rounded-2xl font-semibold text-base flex items-center justify-center gap-2 text-white disabled:opacity-60 ${lastStep ? 'bg-olive' : 'bg-caramel-700 hover:bg-caramel-800'}`;
  if (W.step !== 0) stopCamera();
  if (W.step === 1) renderParams();
  if (W.step === 2) renderSchematic();
  if (W.step === 3) renderChecklist();

  [...$('#wizTrack').children].forEach((p, i) => { p.inert = i !== W.step; p.setAttribute('aria-hidden', i !== W.step); });
}
function canAdvance() {
  if (W.step === 0 && !W.scanned) { toast('Scan or type the battery ID first.', 'warn'); return false; }
  if (W.step === 1) {
    const missing = PARAMS.filter(p => !evalParam(p, W.readings[p.key])).length;
    if (missing) { toast(`Fill in ${missing} more reading${missing > 1 ? 's' : ''}.`, 'warn'); return false; }
    if (+W.readings.temp > 55) { toast('Pack too hot. Follow the safety steps before you continue.', 'err'); return false; }
  }
  if (W.step === 3 && !safetyDone()) { W.open[0] = true; renderChecklist(); toast('Finish the safety items first.', 'warn'); return false; }
  return true;
}
function wizGo(d) {
  if (d > 0 && !canAdvance()) return;
  W.step = Math.min(STEP_NAMES.length - 1, Math.max(0, W.step + d)); renderWizard();
  $('#wizTrack').children[W.step].scrollTop = 0;
}
function bindSwipe() {
  let x0 = null, y0 = null; const v = $('#wizView');
  v.addEventListener('touchstart', e => { if (e.target.closest('canvas,input,select,textarea,svg,video')) { x0 = null; return; } x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  v.addEventListener('touchend', e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5 && $('#wizDone').classList.contains('hidden')) wizGo(dx < 0 ? 1 : -1); x0 = null; });
}

/* --- loading: page through everything, since stock is counted from day one --- */
async function fetchAll(build) {
  const out = []; const size = 1000;
  for (let from = 0; from < 50000; from += size) {
    const { data, error } = await build().range(from, from + size - 1);
    if (error) throw error;
    out.push(...(data || [])); if (!data || data.length < size) break;
  }
  return out;
}
async function loadStageData() {
  const [st, al, is] = await Promise.all([
    fetchAll(() => S.sb.from('stage_logs').select('id,user_id,day,stage,data,note,updated_at').order('day')),
    fetchAll(() => S.sb.from('allocations').select('*').order('created_at')),
    S.sb.from('issue_types').select('*').order('sort')
  ]);
  if (is.error) throw is.error;
  S.stage = st; S.alloc = al; S.issues = is.data || [];
}

/* sanity checks so the numbers add up */
function stageCheck(k, d) {
  const t = d.t || {};
  for (const b of TEAMS) {
    const x = t[b] || {};
    if (k === 'insulation' && (x.passed || 0) + (x.failed || 0) > (x.tested || 0)) return `${b}: passed + failed can't be more than tested.`;
    if (k === 'air_leak' && (x.passed || 0) + (x.failed || 0) > (x.tested || 0)) return `${b}: passed + failed can't be more than tested.`;
    if (k === 'air_leak' && (x.refixed || 0) > (x.failed || 0)) return `${b}: retest passes can't be more than failures.`;
    if (k === 'iot' && (x.online || 0) + (x.offline || 0) > (x.checked || 0)) return `${b}: online + offline can't be more than checked.`;
    if (k === 'qc' && (x.passed || 0) + (x.failed || 0) > (x.checked || 0)) return `${b}: passed + failed can't be more than checked.`;
  }
  if (k === 'repair' && !d.brand) return 'Choose the brand.';
  return '';
}

/* older screens read one summary per person per day; build it from the stage entries */
function compatLogs() {
  const m = {};
  S.stage.forEach(l => {
    const k = l.user_id + '|' + l.day, o = m[k] = m[k] || { user_id: l.user_id, day: l.day, submitted: true, received: 0, diagnosed: 0, repaired: 0, scrapped: 0, warranty: 0, spares: 0, stations: [], blockers: '' };
    const d = l.data || {};
    if (l.stage === 'receiving') o.received += tSum([l], 'recv', TEAMS);
    if (l.stage === 'diagnosis') o.diagnosed += Object.values(countMap([l], 'issues', TEAMS)).reduce((a, b) => a + b, 0);
    if (l.stage === 'repair') { o.repaired += d.repaired || 0; o.scrapped += d.scrapped || 0; o.warranty += d.warranty || 0; o.spares += d.spares || 0; }
    if (l.stage === 'field') { o.repaired += d.repaired || 0; o.stations = d.stations || []; }
    const bl = d.blockers || l.note; if (bl) o.blockers = o.blockers ? o.blockers + ' · ' + bl : bl;
  });
  return Object.values(m);
}

/* ================= WAREHOUSE NUMBERS, DASHBOARD AND BRAND DOCKET ================= */
const WH = { period: 'month', brand: 'All' };
function periodRange(p) {
  const t = new Date(), to = todayStr();
  if (p === 'today') return [to, to, 'Today'];
  if (p === 'week') { const d = new Date(t); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return [ymd(d), to, 'This week']; }
  if (p === 'month') return [monthStart(), to, fmtMonth(monthStart())];
  return [null, null, 'All time'];
}
const tSum = (logs, field, brands) => logs.reduce((a, l) => a + brands.reduce((s, b) => s + ((((l.data || {}).t || {})[b] || {})[field] || 0), 0), 0);
const repLogs = (brands, from, to) => logsOf('repair', from, to).filter(l => brands.includes((l.data || {}).brand));
const rSum = (logs, f) => logs.reduce((a, l) => a + ((l.data || {})[f] || 0), 0);
function latestPerUser(logs) { const m = {}; logs.forEach(l => { if (!m[l.user_id] || l.day > m[l.user_id].day) m[l.user_id] = l; }); return Object.values(m); }
function countMap(logs, path, brands) {   // {name: n} summed, optionally per-brand nested
  const out = {};
  logs.forEach(l => { const o = getp(l.data || {}, path) || {};
    if (brands) brands.forEach(b => Object.entries(o[b] || {}).forEach(([k, v]) => out[k] = (out[k] || 0) + (+v || 0)));
    else Object.entries(o).forEach(([k, v]) => out[k] = (out[k] || 0) + (+v || 0)); });
  return out;
}
const sortedCounts = m => Object.entries(m).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);

/* flows for a period, plus stock worked out from everything ever logged */
function whNumbers(from, to, brands = TEAMS) {
  const flow = (f, t2) => {
    const rec = logsOf('receiving', f, t2), ins = logsOf('insulation', f, t2), iot = logsOf('iot', f, t2), air = logsOf('air_leak', f, t2), dis = logsOf('dispatch', f, t2), qc = logsOf('qc', f, t2), rep = repLogs(brands, f, t2);
    const diag = countMap(logsOf('diagnosis', f, t2), 'issues', brands);
    return {
      received: tSum(rec, 'recv', brands), diagnosed: Object.values(diag).reduce((a, b) => a + b, 0),
      repaired: rSum(rep, 'repaired'), scrapped: rSum(rep, 'scrapped'), warranty: rSum(rep, 'warranty'),
      insTested: tSum(ins, 'tested', brands), insPassed: tSum(ins, 'passed', brands), insFailed: tSum(ins, 'failed', brands),
      iotChecked: tSum(iot, 'checked', brands), online: tSum(iot, 'online', brands), offline: tSum(iot, 'offline', brands), recovered: tSum(iot, 'recovered', brands),
      airTested: tSum(air, 'tested', brands), airPassed: tSum(air, 'passed', brands), airFailed: tSum(air, 'failed', brands), refixed: tSum(air, 'refixed', brands),
      sent: tSum(dis, 'sent', brands), out: tSum(dis, 'out', brands), back: tSum(dis, 'back', brands),
      qcChecked: tSum(qc, 'checked', brands), qcPassed: tSum(qc, 'passed', brands), qcFailed: tSum(qc, 'failed', brands)
    };
  };
  const p = flow(from, to), A = from || to ? flow(null, null) : p;

  const incoming = tSum(logsOf('receiving', todayStr(), todayStr()), 'incoming', brands);
  return {
    p, A, spares, underTest, allocated, incoming,
    onHand: Math.max(0, A.received + A.back - A.sent - A.out),
    awaitingDiag: Math.max(0, A.received - A.diagnosed),
    underRepair: Math.max(0, allocated - A.repaired - A.scrapped - A.warranty - spares - underTest),
    iotOffline: Math.max(0, A.offline - A.recovered),
    airFail: Math.max(0, A.airFailed - A.refixed),
    ready: Math.max(0, A.airPassed + A.refixed - A.sent),

}
/* one technician: given by SPOC vs finished vs still holding */
function techDocket(uid) {

}

/* everything logged in the period as a spreadsheet: one row per entry and number */
function downloadCsv(from, to, plabel) {
  const rows = [['Day', 'Staff ID', 'Name', 'Stage', 'Brand', 'Item', 'Number', 'Notes']];
  const flat = (o, pre = []) => Object.entries(o || {}).flatMap(([k, v]) => v && typeof v === 'object' && !Array.isArray(v) ? flat(v, pre.concat(k)) : [[pre.concat(k), v]]);
  S.stage.filter(l => l.stage !== 'field' || S.role === 'admin').filter(l => (!from || l.day >= from) && (!to || l.day <= to)).forEach(l => {
    const p = person(l.user_id) || {}, base = [l.day, p.staff_id || '', p.full_name || '', l.stage === 'field' ? 'Field' : STAGES[l.stage].label];
    const d = { ...l.data }; const mistakes = d.mistakes || []; delete d.mistakes; const st = d.stations || []; delete d.stations;
    flat(d).forEach(([path, v]) => {
      let brand = l.stage === 'repair' ? d.brand || '' : ''; let item = path.filter(x => x !== 't');
      if (TEAMS.includes(item[0])) { brand = item[0]; item = item.slice(1); } else if (TEAMS.includes(item[1])) { brand = item[1]; item = [item[0], ...item.slice(2)]; }
      if (path[0] === 'brand') return;
      rows.push([...base, brand, item.join(' / '), typeof v === 'number' ? v : '', typeof v === 'number' ? '' : v]);
    });
    mistakes.forEach(m => rows.push([...base, m.brand, 'Mistake by ' + personName(m.tech), m.n, m.reason || '']));
    if (st.length) rows.push([...base, '', 'Stations visited', st.length, st.map(id => (S.stations.find(s => s.id === id) || {}).name).filter(Boolean).join('; ')]);
    if (l.note) rows.push([...base, '', 'Note', '', l.note]);
  });
  const csv = rows.map(r => r.map(c => { c = String(c ?? ''); return /[",\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(',')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv' }));
  a.download = `battery-ops-${plabel.toLowerCase().replace(/\s+/g, '-')}.csv`; document.body.appendChild(a); a.click(); a.remove();
  toast(`${rows.length - 1} rows downloaded`);
}

      ${statCard('Failed, back to warehouse', sum('failed_back'), 'fa-rotate-left', 'bg-terra-50 text-terra', plabel)}
      ${statCard('Stations visited', `${visited.size}<span class="text-sm font-sans text-espresso-500"> / ${stations.length}</span>`, 'fa-charging-station', 'bg-caramel-100 text-caramel-800', `${stations.filter(s => !s.field_tech_id).length} not assigned`)}
      ${statCard('Logged today', `${loggedToday.size}<span class="text-sm font-sans text-espresso-500"> / ${techs.length}</span>`, 'fa-user-check', 'bg-cream-100 text-espresso-700', 'field technicians')}
    </div>
    ${panel('Field technicians', board.length ? `<div class="overflow-x-auto"><table class="w-full text-sm min-w-[34rem]"><thead><tr class="text-espresso-500"><th class="text-left font-medium pb-2">Technician</th><th class="font-medium pb-2 text-right">Repaired</th><th class="font-medium pb-2 text-right">Failed back</th><th class="font-medium pb-2 text-right">Stations visited</th><th class="font-medium pb-2 text-right">Assigned</th><th class="font-medium pb-2 text-right">Days logged</th></tr></thead>
      <tbody>${board.map((r, i) => `<tr class="border-t border-cream-100"><td class="py-2"><button data-person="${r.t.id}" class="flex items-center gap-2.5 text-left">${avatar(r.t, 'w-8 h-8 text-[11px]')}<span><span class="block font-medium">${i < 3 && r.rep ? ['🥇 ', '🥈 ', '🥉 '][i] : ''}${esc(r.t.full_name)}</span><span class="block text-xs text-espresso-500">${esc(r.t.staff_id)} · ${esc(r.t.region || 'no region')}${loggedToday.has(r.t.id) ? '' : ' · <span class="text-warn-800">not logged today</span>'}</span></span></button></td>
        <td class="py-2 text-right tnum font-semibold text-olive-700">${r.rep}</td><td class="py-2 text-right tnum ${r.back ? 'text-terra' : ''}">${r.back}</td><td class="py-2 text-right tnum">${r.st}</td><td class="py-2 text-right tnum">${r.mine}</td><td class="py-2 text-right tnum">${r.days}</td></tr>`).join('')}</tbody></table></div>` : '<p class="text-sm text-espresso-500">No field technicians in this view.</p>', '', 'best performers first')}
    <div class="grid xl:grid-cols-3 gap-5">
      ${panel('Blockers', feedHtml('blockers', 'bg-warn-50 text-warn-800'))}
      ${panel('Issues found', feedHtml('issues', 'bg-cream-100'))}
      ${panel('Improvements asked for', feedHtml('improvements', 'bg-olive-50 text-olive-700'))}
    </div></div>`;
  bindScope(renderRegion); bindPeriod(renderRegion);
  $$('#main [data-person]').forEach(b => b.onclick = () => S.role === 'admin' ? userDrawer(b.dataset.person) : personDrawer(b.dataset.person));
}

/* ================= STATIONS: regional manager assigns stations to their field technicians ================= */
const ST = { q: '', show: 'all', limit: 60 };
function renderStations() {
  const sc = scope(), canAssign = S.role === 'admin' || (S.me.roles || []).includes('rm');
  const all = S.stations.filter(s => sc.region === 'All' || s.region === sc.region);
  const techsFor = region => S.peopleList.filter(p => isTechProfile(p) && kindOf(p) === 'field' && (!region || p.region === region)).sort((a, b) => a.full_name.localeCompare(b.full_name));
  const q = ST.q.toLowerCase();
  const list = all.filter(s => (ST.show === 'all' || (ST.show === 'none' ? !s.field_tech_id : s.field_tech_id === ST.show)) && (!q || (s.name + ' ' + (s.sub_region || '') + ' ' + personName(s.field_tech_id)).toLowerCase().includes(q)));
  const regionTechs = techsFor(sc.region === 'All' ? null : sc.region);
  setTitle('Stations', `${all.length} stations · ${all.filter(s => !s.field_tech_id).length} not assigned`);
  $('#main').innerHTML = `<div class="p-4 md:p-6 space-y-4">
    <div class="flex flex-wrap items-center gap-2">${scopeBar({ noKind: true })}
      <input id="stQ" value="${esc(ST.q)}" class="${inputC} h-10 max-w-xs" placeholder="Search station or technician" aria-label="Search stations">
      <select id="stShow" aria-label="Show" class="h-10 rounded-xl border border-cream-300 bg-surface px-3 text-sm font-medium"><option value="all">All stations</option><option value="none" ${ST.show === 'none' ? 'selected' : ''}>Not assigned</option>${regionTechs.map(t => `<option value="${t.id}" ${ST.show === t.id ? 'selected' : ''}>${esc(t.full_name)} (${S.stations.filter(s => s.field_tech_id === t.id).length})</option>`).join('')}</select></div>
    ${card(`<ul class="divide-y divide-cream-100">${list.slice(0, ST.limit).map(s => `<li class="px-4 py-2.5 flex flex-wrap items-center gap-3"><span class="flex-1 min-w-[12rem]"><span class="block font-medium">${esc(s.name)}</span><span class="block text-xs text-espresso-500">${esc([s.sub_region, s.region].filter(Boolean).join(' · '))}</span></span>
      ${canAssign ? `<select data-assign="${s.id}" aria-label="Technician for ${esc(s.name)}" class="h-10 w-56 rounded-xl border border-cream-300 bg-surface px-3 text-sm"><option value="">Not assigned</option>${techsFor(s.region).map(t => `<option value="${t.id}" ${s.field_tech_id === t.id ? 'selected' : ''}>${esc(t.full_name)}</option>`).join('')}</select>` : `<span class="text-sm">${esc(s.field_tech_id ? personName(s.field_tech_id) : 'Not assigned')}</span>`}</li>`).join('') || '<li class="p-6 text-center text-sm text-espresso-500">No stations match.</li>'}</ul>
      ${list.length > ST.limit ? `<div class="p-3 text-center"><button id="stMore" class="${btnS} h-10">Show more (${list.length - ST.limit} left)</button></div>` : ''}`)}
  </div>`;
  bindScope(() => { ST.limit = 60; renderStations(); });
  $('#stQ').oninput = e => { ST.q = e.target.value; ST.limit = 60; clearTimeout(ST.t); ST.t = setTimeout(() => { renderStations(); const i = $('#stQ'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }, 250); };
  $('#stShow').onchange = e => { ST.show = e.target.value; renderStations(); };
  if ($('#stMore')) $('#stMore').onclick = () => { ST.limit += 100; renderStations(); };
  $$('[data-assign]').forEach(sel => sel.onchange = async () => {
    const s = S.stations.find(x => x.id === sel.dataset.assign), prev = s.field_tech_id;
    sel.disabled = true;
    const { error } = await S.sb.rpc('assign_station', { p_station: s.id, p_tech: sel.value || null });
    sel.disabled = false;
    if (error) { sel.value = prev || ''; return toast(errMsg(error), 'err'); }
    s.field_tech_id = sel.value || null; toast(sel.value ? `${s.name} → ${firstName(personName(sel.value))}` : `${s.name} unassigned`);
  });
}

/* ================= SETTINGS: supervisor edits issue lists ================= */
const KIND_LABEL = { fault: 'Battery issues (diagnosis and repairs)', insulation: 'Insulation fail reasons', iot: 'IoT offline reasons', handover: 'Handover reasons (Quality / O&M)', scrap: 'Scrap reasons' };
function renderSettings() {
  setTitle('Settings', 'Lists people pick from');
  $('#main').innerHTML = `<div class="p-4 md:p-6 grid lg:grid-cols-2 gap-5">${Object.entries(KIND_LABEL).map(([k, l]) => panel(l, `<ul class="space-y-1.5">${S.issues.filter(i => i.kind === k).sort((a, b) => a.sort - b.sort || a.name.localeCompare(b.name)).map(i => `<li class="flex items-center gap-2"><input data-iname="${i.id}" value="${esc(i.name)}" maxlength="60" aria-label="Name" class="${inputC} h-10 flex-1 ${i.active ? '' : 'line-through text-espresso-500'}"><button data-itoggle="${i.id}" class="h-10 px-3 rounded-xl border border-cream-300 text-sm ${i.active ? '' : 'bg-cream-100'}">${i.active ? 'Hide' : 'Show'}</button></li>`).join('')}</ul>
    <form data-iadd="${k}" class="mt-3 flex gap-2"><input name="n" maxlength="60" required placeholder="Add another" aria-label="New ${esc(l)}" class="${inputC} h-10 flex-1"><button class="${btnP} h-10">Add</button></form>`)).join('')}</div>`;
  const save = async (id, patch) => { const { error } = await S.sb.from('issue_types').update(patch).eq('id', id); if (error) { toast(errMsg(error), 'err'); return false; } Object.assign(S.issues.find(i => i.id == id), patch); return true; };
  $$('[data-iname]').forEach(inp => inp.onchange = async () => { const v = inp.value.trim(); if (!v) return; if (await save(inp.dataset.iname, { name: v })) toast('Renamed'); });
  $$('[data-itoggle]').forEach(b => b.onclick = async () => { const i = S.issues.find(x => x.id == b.dataset.itoggle); if (await save(i.id, { active: !i.active })) renderSettings(); });
  $$('[data-iadd]').forEach(f => f.onsubmit = async e => {
    e.preventDefault(); const name = f.n.value.trim(); if (!name) return;
    const { data, error } = await S.sb.from('issue_types').insert({ kind: f.dataset.iadd, name, sort: 50 }).select().single();
    if (error) return toast(/duplicate/i.test(error.message) ? 'That one is already on the list' : errMsg(error), 'err');
    S.issues.push(data); toast('Added'); renderSettings();
  });
}

/* ================= BOOT ================= */
(async function boot() {
  if (!window.supabase || !window.supabase.createClient) {
    $('#boot').innerHTML = '<div class="text-center px-6"><i class="fa-solid fa-wifi text-3xl text-terra"></i><p class="mt-3 font-semibold">Could not load Battery Ops</p><p class="text-sm text-espresso-600 mt-1">Check your internet connection, then refresh the page.</p><button onclick="location.reload()" class="' + btnP + ' mt-4">Try again</button></div>';
    return;
  }
  S.sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'bo-auth' } });
  S.sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT' && S.loaded) { S.loaded = false; showAuth('login', 'You were signed out. Sign in again.'); } });
  try {
    const { data } = await S.sb.auth.getSession();
    if (data && data.session && data.session.user) { S.user = data.session.user; return await afterLogin(false); }
  } catch (e) { console.warn(e); }
  showAuth('login');
})();
</script>
</body>
</html>
