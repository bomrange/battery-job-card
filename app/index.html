function resizeImage(file, max = 360, q = 0.82) {
  return new Promise((res, rej) => {
    if (!file.type.startsWith('image/')) return rej(new Error('Choose a photo file'));
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error('Could not read photo')), 'image/jpeg', q);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Could not read photo')); };
    img.src = url;

async function loadAll() {

  const q = [

    S.sb.from('stations').select('id,name,region').eq('active', true).order('name'),

function confirmInline(btn, txt) {
  if (btn.dataset.armed) return true;
  btn.dataset.armed = '1'; const old = btn.innerHTML; btn.innerHTML = esc(txt); btn.classList.add('border-terra', 'text-terra');
  setTimeout(() => { if (btn.isConnected) { delete btn.dataset.armed; btn.innerHTML = old; btn.classList.remove('border-terra', 'text-terra'); } }, 3000);
  return false;
}
function techOptions(sel, team) {
  const list = S.peopleList.filter(p => isTechProfile(p) && (!team || team === 'All' || p.team === team || p.team === 'All'));
  return `<option value="">Unassigned</option>` + list.map(p => `<option value="${p.id}" ${p.id === sel ? 'selected' : ''}>${esc(p.full_name)} · ${esc(p.staff_id)}${p.team && p.team !== 'All' ? ' · ' + esc(p.team) : ''}</option>`).join('');
}

/* --- new / edit job --- */
function jobForm(j) {
  if (!R().can.assign) return;
  const d = j ? new Date(j.start_at) : (() => { const x = new Date(S.day + 'T00:00'); const n = new Date(); if (S.day === todayStr()) { x.setHours(n.getHours() + (n.getMinutes() > 30 ? 1 : 0), n.getMinutes() > 30 ? 0 : 30); } else x.setHours(8, 0); return x; })();
  const due = j ? new Date(j.due_at) : new Date(d.getTime() + 3 * 3600000);
  openModal(`${modalHead(j ? 'Edit ' + j.jc_no : 'New job')}
    <form id="jobF" class="p-5 space-y-3" novalidate>
      <label class="block"><span class="text-sm font-medium">What needs doing</span><input name="title" maxlength="120" value="${esc(j ? j.title : '')}" class="${inputC} mt-1.5" placeholder="e.g. Charge port burnt pin"></label>
      <div class="grid grid-cols-2 gap-3">
        <label class="block"><span class="text-sm font-medium">Fault type</span><select name="fault" class="${inputC} mt-1.5">${FAULTS.map(f => `<option ${j && j.fault === f ? 'selected' : ''}>${f}</option>`).join('')}</select></label>
        <label class="block"><span class="text-sm font-medium">Brand</span><select name="brand" class="${inputC} mt-1.5"><option value="">—</option>${TEAMS.map(t => `<option ${j && j.brand === t ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
      </div>
      <label class="block"><span class="text-sm font-medium">Battery ID <span class="text-espresso-500 font-normal">(optional, can be scanned at the job)</span></span><input name="battery" maxlength="24" value="${esc(j ? j.battery_id || '' : '')}" class="${inputC} mt-1.5 uppercase tnum" placeholder="e.g. C123456"></label>
      <label class="block"><span class="text-sm font-medium">Technician</span><select name="tech" class="${inputC} mt-1.5">${techOptions(j ? j.tech_id : '', S.teamFilter)}</select></label>
      <label class="block"><span class="text-sm font-medium">Station <span class="text-espresso-500 font-normal">(optional)</span></span><select name="station" class="${inputC} mt-1.5"><option value="">Warehouse / none</option>${S.stations.map(s => `<option value="${s.id}" ${j && j.station_id === s.id ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select></label>
      <div class="grid grid-cols-3 gap-3">
        <label class="block"><span class="text-sm font-medium">Day</span><input name="day" type="date" value="${ymd(d)}" class="${inputC} mt-1.5 px-2 tnum"></label>
        <label class="block"><span class="text-sm font-medium">Start</span><input name="start" type="time" value="${hhmm(d)}" class="${inputC} mt-1.5 px-2 tnum"></label>
        <label class="block"><span class="text-sm font-medium">Hours</span><input name="hours" type="number" step="0.25" min="0.25" max="12" value="${j ? j.hours : 1.5}" class="${inputC} mt-1.5 tnum"></label>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <label class="block"><span class="text-sm font-medium">Deadline day</span><input name="dueDay" type="date" value="${ymd(due)}" class="${inputC} mt-1.5 px-2 tnum"></label>
        <label class="block"><span class="text-sm font-medium">Deadline time</span><input name="dueTime" type="time" value="${hhmm(due)}" class="${inputC} mt-1.5 px-2 tnum"></label>
      </div>
      <p id="jobErr" class="hidden text-sm text-terra-700 bg-terra-50 border border-terra/30 rounded-lg px-3 py-2"></p>
      <div class="flex gap-2 pt-1"><button type="button" data-close class="${btnS} flex-1">Cancel</button><button class="${btnP} flex-1">${j ? 'Save' : 'Create job'}</button></div>
    </form>`);
  $('#jobF').onsubmit = async e => {
    e.preventDefault();
    const f = e.target, err = $('#jobErr'), show = m => { err.textContent = m; err.classList.remove('hidden'); };
    const start = new Date(`${f.day.value}T${f.start.value}`), dueAt = new Date(`${f.dueDay.value}T${f.dueTime.value}`), hours = +f.hours.value;
    if (f.title.value.trim().length < 2) return show('Describe the job.');
    if (isNaN(start) || isNaN(dueAt)) return show('Check the day and times.');
    if (!(hours > 0 && hours <= 12)) return show('Hours must be between 0.25 and 12.');
    if (dueAt <= start) return show('The deadline must be after the start time.');
    const row = { title: f.title.value.trim(), fault: f.fault.value, brand: f.brand.value || null, battery_id: f.battery.value.trim().toUpperCase() || null,
      tech_id: f.tech.value || null, station_id: f.station.value || null, start_at: start.toISOString(), hours, due_at: dueAt.toISOString() };
    const b = f.querySelector('button:not([type=button])'); busy(b, true, 'Saving…');
    const res = j ? await S.sb.from('jobs').update(row).eq('id', j.id).select().single() : await S.sb.from('jobs').insert(row).select().single();
    busy(b, false);
    if (res.error) return show(errMsg(res.error));
    const saved = res.data; const i = S.jobs.findIndex(x => x.id === saved.id); if (i >= 0) S.jobs[i] = saved; else S.jobs.push(saved);
    closeModal(); toast(j ? `${saved.jc_no} saved` : `${saved.jc_no} created${saved.tech_id ? ' for ' + firstName(personName(saved.tech_id)) : ''}`);
    S.day = ymd(new Date(saved.start_at)); if (S.view === 'dispatch') renderDispatch();
    if (j) openJob(saved.id, true);
  };
}

function renderRequests() {

];

function evalParam(p, v) {
  if (v === '' || v === undefined || v === null || isNaN(+v)) return null;
  v = +v; if (v < p.min || v > p.max) return 'error'; if (v < p.wmin || v > p.wmax) return 'warn'; return 'ok';
}
const readingStates = () => PARAMS.map(p => ({ p, s: evalParam(p, W.readings[p.key]) }));
function suspectParts() {
  const set = new Set();
  readingStates().forEach(({ p, s }) => { if (s === 'error' || s === 'warn') { if (p.part === 'cells') { set.add('cellsA'); set.add('cellsB'); } else set.add(p.part); } });
  if (W.readings.cmin && W.readings.cmax && +W.readings.cmin > +W.readings.cmax) { set.add('cellsA'); set.add('cellsB'); }
  return set;
}
const safetyDone = () => CHECKLIST.every((g, gi) => !g.req || g.items.every((_, ii) => W.checks[gi + '-' + ii]));

async function startCamera(j) {

function setScanned(id, j, byCam) { W.scanned = id; W.scannedByCam = byCam; showScanResult(j); toast(`Battery ${id} ${byCam ? 'scanned' : 'entered'}`); }

  W.sigInk = false; sigCtx = null;
  const c = $('#sig'), pos = e => { const r = c.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  const setup = () => { const r = c.getBoundingClientRect(); if (!r.width) return; const d = window.devicePixelRatio || 1; c.width = Math.round(r.width * d); c.height = Math.round(r.height * d); sigCtx = c.getContext('2d'); sigCtx.setTransform(d, 0, 0, d, 0, 0); sigCtx.lineWidth = 2.4; sigCtx.lineCap = 'round'; sigCtx.lineJoin = 'round'; sigCtx.strokeStyle = '#2C1A14'; };
  c.addEventListener('pointerdown', e => { if (!sigCtx) setup(); drawing = true; last = pos(e); c.setPointerCapture(e.pointerId); });
  c.addEventListener('pointermove', e => { if (!drawing || !sigCtx) return; const p = pos(e); sigCtx.beginPath(); sigCtx.moveTo(last.x, last.y); sigCtx.lineTo(p.x, p.y); sigCtx.stroke(); last = p; if (!W.sigInk) { W.sigInk = true; $('#sigHint').classList.add('hidden'); } });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => c.addEventListener(ev, () => drawing = false));
  $('#sigClear').onclick = () => { if (sigCtx) { const r = c.getBoundingClientRect(); sigCtx.clearRect(0, 0, r.width, r.height); } W.sigInk = false; $('#sigHint').classList.remove('hidden'); };
}

/* --- wizard navigation --- */
function renderWizard() {
  $('#wizTrack').style.transform = `translateX(-${W.step * 100}%)`;
  $('#stepBars').innerHTML = STEP_NAMES.map((_, i) => `<span class="h-1.5 flex-1 rounded-full ${i <= W.step ? 'bg-caramel-400' : 'bg-white/20'}"></span>`).join('');
  $('#stepLabel').textContent = `Step ${W.step + 1} of ${STEP_NAMES.length} · ${STEP_NAMES[W.step]}`;
  $('#wizBack').disabled = W.step === 0;
  const lastStep = W.step === STEP_NAMES.length - 1;
  $('#wizNext').innerHTML = lastStep ? '<i class="fa-solid fa-paper-plane"></i>Submit job card' : `Next: ${STEP_NAMES[W.step + 1]}<i class="fa-solid fa-chevron-right"></i>`;
  $('#wizNext').className = `h-14 flex-1 rounded-2xl font-semibold text-base flex items-center justify-center gap-2 text-white disabled:opacity-60 ${lastStep ? 'bg-olive' : 'bg-caramel-700 hover:bg-caramel-800'}`;
  if (W.step !== 0) stopCamera();
  if (W.step === 1) renderParams();
  if (W.step === 2) renderSchematic();
  if (W.step === 3) renderChecklist();
  if (W.step === 4) renderSignStep();
  [...$('#wizTrack').children].forEach((p, i) => { p.inert = i !== W.step; p.setAttribute('aria-hidden', i !== W.step); });
}
function canAdvance() {
  if (W.step === 0 && !W.scanned) { toast('Scan or type the battery ID first.', 'warn'); return false; }
  if (W.step === 1) {
    const missing = PARAMS.filter(p => !evalParam(p, W.readings[p.key])).length;
    if (missing) { toast(`Fill in ${missing} more reading${missing > 1 ? 's' : ''}.`, 'warn'); return false; }
    if (+W.readings.temp > 55) { toast('Pack too hot. Follow the safety steps before you continue.', 'err'); return false; }
  }
  if (W.step === 3 && !safetyDone()) { W.open[0] = true; renderChecklist(); toast('Finish the safety items first.', 'warn'); return false; }
  return true;
}
function wizGo(d) {
  if (d > 0 && !canAdvance()) return;
  W.step = Math.min(STEP_NAMES.length - 1, Math.max(0, W.step + d)); renderWizard();
  $('#wizTrack').children[W.step].scrollTop = 0;
}
function bindSwipe() {
  let x0 = null, y0 = null; const v = $('#wizView');
  v.addEventListener('touchstart', e => { if (e.target.closest('canvas,input,select,textarea,svg,video')) { x0 = null; return; } x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  v.addEventListener('touchend', e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5 && $('#wizDone').classList.contains('hidden')) wizGo(dx < 0 ? 1 : -1); x0 = null; });
}
async function submitJob(j) {
  if (!W.outcome) { toast('Choose an outcome.', 'warn'); $('#outcome').focus(); return; }
  if (!W.sigInk) { toast('Add your signature.', 'warn'); return; }
  const total = CHECKLIST.reduce((a, g) => a + g.items.length, 0);
  const report = { readings: W.readings, parts: W.parts, faults: Object.entries(W.parts).filter(([, v]) => v === 'fault').map(([k]) => PARTS[k].label),
    checklist: { done: Object.values(W.checks).filter(Boolean).length, total, items: W.checks }, note: (W.note || '').trim(), scanned: W.scanned, scannedByCam: !!W.scannedByCam,
    signature: $('#sig').toDataURL('image/png'), by: S.me.id, at: new Date().toISOString() };
  const b = $('#wizNext'); busy(b, true, 'Sending…');
  const { error } = await S.sb.rpc('submit_job', { p_id: j.id, p_battery: W.scanned, p_outcome: W.outcome, p_report: report });
  busy(b, false);
  if (error) return toast(errMsg(error), 'err');
  Object.assign(j, { status: 'done', outcome: W.outcome, report, battery_id: W.scanned || j.battery_id, done_at: new Date().toISOString() });
  const done = $('#wizDone'); done.classList.remove('hidden'); done.classList.add('flex'); $('#wizBar').classList.add('hidden');
  done.innerHTML = `<div class="w-20 h-20 rounded-full bg-olive text-white grid place-items-center text-4xl"><i class="fa-solid fa-check"></i></div>
    <h3 class="mt-5 font-display text-2xl font-semibold">Job card submitted</h3><p class="mt-2 text-espresso-600">${esc(j.jc_no)} · ${esc(W.scanned || '')} · ${esc(W.outcome)}.<br>It's added to today's log and your supervisor can see it now.</p>
    <button id="nextJob" class="${btnP} mt-6 h-12 px-6">Back to my jobs</button>`;
  $('#nextJob').onclick = () => { S.fieldJob = null; softRefresh(); renderField(); };
  toast('Job card submitted');
  S.sb.from('daily_logs').select('*').eq('user_id', j.tech_id || S.me.id).eq('day', todayStr()).then(r => { if (r.data && r.data[0]) { S.logs = S.logs.filter(l => !(l.user_id === r.data[0].user_id && l.day === r.data[0].day)).concat(r.data); dayDraft = null; } }, () => {});
}

/* ================= BOOT ================= */
(async function boot() {
  if (!window.supabase || !window.supabase.createClient) {
    $('#boot').innerHTML = '<div class="text-center px-6"><i class="fa-solid fa-wifi text-3xl text-terra"></i><p class="mt-3 font-semibold">Could not load Battery Ops</p><p class="text-sm text-espresso-600 mt-1">Check your internet connection, then refresh the page.</p><button onclick="location.reload()" class="' + btnP + ' mt-4">Try again</button></div>';
    return;
  }
  S.sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'bo-auth' } });
  S.sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT' && S.loaded) { S.loaded = false; showAuth('login', 'You were signed out. Sign in again.'); } });
  try {
    const { data } = await S.sb.auth.getSession();
    if (data && data.session && data.session.user) { S.user = data.session.user; return await afterLogin(false); }
  } catch (e) { console.warn(e); }
  showAuth('login');
})();
</script>
